input,textarea,select,button{font-family:inherit;color:var(--text);}
textarea{resize:vertical;}

.screen{max-width:680px;margin:0 auto;padding:22px 14px 140px;}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);margin-bottom:14px;}
.btn{padding:8px 16px;border-radius:12px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;color:#fff;}
.btn-p{background:var(--sage);}
.btn-a{background:var(--accent);}
.btn-o{background:var(--olive);}
.btn-b{background:var(--blue);}
.btn-n{background:var(--paper);color:var(--text);}
.btn-red{background:#E07070;color:#fff;}
.inp{width:100%;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:9px 12px;font-size:13px;background:rgba(255,255,255,.7);outline:none;font-family:inherit;color:var(--text);}
.inp:focus{border-color:var(--sage);}
.sel{width:100%;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:9px 12px;font-size:13px;background:rgba(255,255,255,.7);outline:none;font-family:inherit;cursor:pointer;color:var(--text);}
.bar-track{border-radius:8px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;border-radius:8px;transition:width .5s ease;}
.hidden{display:none!important;}

/* NAV */
#nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 10px 12px;background:linear-gradient(to top,var(--nav-bg) 70%,transparent);}
#nav-inner{display:flex;align-items:center;justify-content:space-around;max-width:680px;margin:0 auto;background:var(--nav-bg);border-radius:20px;padding:4px 4px;border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 20px rgba(0,0,0,.09);overflow-x:auto;gap:2px;}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:48px;border-radius:13px;border:none;cursor:pointer;background:transparent;transition:all .18s;padding:0 4px;flex-shrink:0;font-family:inherit;}
.nav-btn svg{opacity:.45;transition:all .18s;}
.nav-btn.active{background:rgba(255,255,255,.85);box-shadow:0 1px 6px rgba(0,0,0,.09);}
.nav-btn.active svg{opacity:1;stroke:var(--sage);}
.nav-label{font-size:7.5px;font-weight:700;color:var(--sage);margin-top:1px;display:none;letter-spacing:.2px;}
.nav-btn.active .nav-label{display:block;}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:16px;}
.mbox{background:var(--bg);border-radius:22px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.18);width:100%;max-width:380px;max-height:88vh;overflow-y:auto;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal-dh{font-size:11px;font-weight:600;opacity:.45;padding:4px 0;}
.cal-dc{height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:12px;}
.cal-dc .inner{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.cal-dc:hover .inner{background:rgba(0,0,0,.06);}
.cal-dc.today .inner{background:var(--sage);color:#fff;font-weight:700;}
.cal-dc.sel1 .inner{background:var(--accent);color:#fff;}
.cal-dc.hasd::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:2px;border-radius:1px;background:var(--accent);}
.cal-study-time{font-size:7px;color:var(--sage);font-weight:600;line-height:1;margin-top:1px;}

/* TIMER */
.flip-card{border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.flip-card::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(0,0,0,.06);}
.flip-digit{font-weight:800;letter-spacing:-2px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;}

/* RINGS */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.ring-lbl{font-size:10px;color:var(--muted);text-align:center;}

/* AMBIENT */
#ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#ab1{position:absolute;top:-8%;right:-4%;width:380px;height:380px;border-radius:50%;opacity:.3;filter:blur(80px);mix-blend-mode:multiply;background:var(--blob1);}
#ab2{position:absolute;bottom:-12%;left:-8%;width:480px;height:480px;border-radius:50%;opacity:.12;filter:blur(90px);mix-blend-mode:multiply;background:var(--blob2);}

.page{display:none;position:relative;z-index:1;}
.page.active{display:block;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-title{font-weight:700;font-size:14px;}
.task-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:11px;margin-bottom:7px;transition:background .12s;}
.task-row:not(.done){background:rgba(255,255,255,.42);}
.task-row.done{opacity:.5;}
.task-row.done .ttext{text-decoration:line-through;}
.ttext{flex:1;font-size:13px;}
.iBtn{background:none;border:none;cursor:pointer;padding:3px;display:flex;align-items:center;justify-content:center;opacity:.6;transition:opacity .15s;}
.iBtn:hover{opacity:1;}
.row2{display:flex;gap:8px;margin-bottom:9px;}
.row2 .inp{flex:1;}
.dashed-add{width:100%;padding:9px 14px;border-radius:13px;border:2px dashed var(--sage);background:transparent;color:var(--sage);font-weight:600;font-size:13px;cursor:pointer;margin-bottom:13px;font-family:inherit;}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(214,180,168,.25);color:var(--text);}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:12px 0;}
.tag-chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(163,177,138,.18);color:var(--sage);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
.log-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.38);margin-bottom:8px;}
.stat-box{padding:13px;border-radius:13px;text-align:center;}
.stat-val{font-size:19px;font-weight:800;}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.day-tab{padding:7px 13px;border-radius:19px;border:none;cursor:pointer;font-weight:600;font-size:12px;flex-shrink:0;font-family:inherit;transition:all .18s;}
.snote-hdr{width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:none;cursor:pointer;border-radius:10px;text-align:left;font-family:inherit;font-size:13px;font-weight:600;transition:background .12s;}
.water-d{height:30px;border-radius:7px;cursor:pointer;border:1.5px solid #bde0ff;transition:all .14s;}
/* settings panel */
.theme-swatch{width:100%;padding:12px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:8px;transition:all .18s;font-family:inherit;}
.theme-swatch.active-theme{border-color:var(--sage);}

/* ── ARABIC / RTL SUPPORT (whole app) ── */
body.lang-ar{font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
body.lang-ar #goverlay [dir="rtl"]{line-height:1.7;}
/* text inputs & textareas should follow RTL so typed Arabic text flows right-to-left */
body.lang-ar .inp{direction:rtl;text-align:right;}
body.lang-ar .inp[dir="auto"]{direction:rtl;unicode-bidi:plaintext;text-align:start;}
/* elements with an inline text-align:left don't flip with dir=rtl automatically — force them */
body.lang-ar [style*="text-align:left"]{text-align:right!important;}
/* keep number/time fields readable left-to-right even in RTL layout */
body.lang-ar input[type="number"],
body.lang-ar #hs-time,body.lang-ar #timer-phase-lbl{direction:ltr;}

/* ── RESPONSIVE ── */
@media (max-width:480px){
  .screen{padding:16px 12px 130px;}
  .mbox{max-width:100%;margin:0 8px;border-radius:18px;}
  .nav-btn{min-width:38px;height:44px;}
  .nav-label{font-size:7px;}
  #nav-inner{padding:3px 4px;gap:1px;}
}
@media (min-width:768px){
  .screen{padding:28px 24px 140px;}
  .card{padding:20px;}
}
@media (orientation:landscape) and (max-height:500px){
  .screen{padding:12px 16px 100px;}
  #nav-bar{padding:4px 10px 8px;}
  #nav-inner{border-radius:16px;}
  .nav-btn{height:40px;min-width:40px;}
}
/* Ensure buttons never clip off screen */
#nav-inner{min-width:0;flex-wrap:nowrap;}
.nav-btn{flex-shrink:0;}
body{overflow-x:hidden;}
/* Code protection — prevent easy text selection/copying */
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text;}
/* Persistent ownership watermark */
#__nx_wm{
  position:fixed!important;bottom:0!important;left:0!important;right:0!important;
  z-index:99999!important;pointer-events:none!important;
  padding:3px 10px!important;text-align:center!important;
  font-size:10px!important;font-weight:600!important;letter-spacing:.3px!important;
  background:rgba(163,177,138,.1)!important;
  color:rgba(163,177,138,.5)!important;
  font-family:Inter,system-ui,sans-serif!important;
  user-select:none!important;-webkit-user-select:none!important;
  display:none!important;visibility:visible!important;opacity:1!important;
}

/* ── ATTACHMENTS ── */
.att-block{margin-top:10px;border-top:1px dashed rgba(0,0,0,.08);padding-top:10px;}
.att-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.att-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.att-head-note{font-size:10px;color:var(--muted);}
.att-upload-label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px dashed var(--sage);background:rgba(255,255,255,.78);color:var(--sage);font-size:11px;font-weight:700;cursor:pointer;}
.att-upload-label input{display:none;}
.att-list{display:flex;flex-direction:column;gap:8px;}
.att-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:10px 12px;min-width:0;}
.att-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(163,177,138,.12);font-size:20px;flex-shrink:0;overflow:hidden;}
.att-thumb-img{width:100%;height:100%;object-fit:cover;display:block;}
.att-meta{min-width:0;}
.att-name{font-size:12px;font-weight:700;line-height:1.35;word-break:break-word;}
.att-size{font-size:10px;color:var(--muted);margin-top:2px;}
.att-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.att-btn{padding:6px 10px;border:none;border-radius:999px;background:var(--paper);color:var(--text);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.att-btn.att-danger{background:rgba(224,112,112,.13);color:#C35E5E;}
.att-empty{font-size:11px;color:var(--muted);padding:2px 2px 0;}
.link-list{display:flex;flex-direction:column;gap:8px;}
.link-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:9px 12px;}
.att-progress-shell{display:flex;flex-direction:column;gap:12px;}
.att-progress-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.att-progress-title{font-size:16px;font-weight:800;}
.att-progress-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;word-break:break-word;}
.att-progress-bar{height:10px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;}
.att-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--accent));transition:width .12s ease;}
.att-progress-stats{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);}
.att-progress-note{font-size:11px;color:var(--muted);line-height:1.6;background:rgba(255,255,255,.45);padding:10px 12px;border-radius:12px;}
.about-link{color:var(--sage);font-weight:700;text-decoration:none;word-break:break-all;}
.about-link:hover{text-decoration:underline;}

.linked-note-text{font-size:13px;line-height:1.75;margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);word-break:break-word;}
.linked-note-text a{color:var(--sage);font-weight:700;text-decoration:underline;}
.linked-url-wrap{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;}
.link-copy-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:none;border-radius:6px;background:rgba(0,0,0,.06);color:var(--sage);font-size:11px;line-height:1;cursor:pointer;font-family:inherit;flex:none;}
.link-copy-btn:hover{background:rgba(0,0,0,.12);}
.nx-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s;}
.nx-upload-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200000;display:flex;align-items:center;justify-content:center;padding:20px;}
.nx-upload-overlay .mbox{background:var(--bg);border-radius:22px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.18);width:100%;max-width:380px;}
.nx-confirm-overlay.nx-open{opacity:1;}
.nx-confirm-card{background:var(--bg);color:var(--text);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(8px);transition:transform .18s;}
.nx-confirm-overlay.nx-open .nx-confirm-card{transform:translateY(0);}
.nx-confirm-msg{font-size:14px;line-height:1.6;margin-bottom:18px;font-weight:600;}
.nx-confirm-actions{display:flex;gap:10px;justify-content:flex-end;}
.nx-confirm-btn{padding:9px 16px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.nx-confirm-cancel{background:var(--paper);color:var(--text);}
.nx-confirm-ok{background:#C35E5E;color:#fff;}
.attachment-screen{position:fixed;inset:0;z-index:100001;background:var(--bg);padding:18px 16px 28px;overflow:auto;display:none;}
.attachment-screen.active{display:block;}
.attachment-screen-card{max-width:760px;margin:0 auto;}
.attachment-screen-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
.attachment-screen-title{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.attachment-screen-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;}
.attachment-grid{display:flex;flex-direction:column;gap:10px;}
.mf-ov-folder{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
.mf-ov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;}
.mf-ov-children{margin-top:10px;padding-inline-start:18px;border-inline-start:2px solid rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px;}
.mf-ov-item{font-size:13px;color:var(--text);}
.attachment-card{background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.attachment-action-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.03);}
.attachment-action-count{font-size:12px;font-weight:800;color:var(--text);}
.attachment-card-selected{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage) inset;}
.att-select-check{font-size:16px;line-height:1;flex:none;}
.attachment-preview-shell{background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:10px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.attachment-preview-shell iframe,.attachment-preview-shell object{width:100%;height:72vh;border:none;border-radius:12px;background:#fff;}
.attachment-preview-shell pre{width:100%;max-height:72vh;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;padding:14px;background:#fff;border-radius:12px;}
.attachment-preview-image-wrap{position:relative;width:100%;height:72vh;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.06);touch-action:none;}
.attachment-preview-image{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center;user-select:none;-webkit-user-drag:none;touch-action:none;}
.attachment-preview-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.attachment-count-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.06);font-size:11px;font-weight:700;color:var(--text);}

// In-memory fallback if localStorage fails (file:// protocol on mobile)
const _mem={};
const LS={
  g(k,d){
    try{
      const v=localStorage.getItem('nx2_'+k);
      if(v!==null){_mem[k]=v;return JSON.parse(v);}
    }catch(e){}
    // Fallback to in-memory cache
    if(_mem[k]!==undefined){try{return JSON.parse(_mem[k]);}catch(e){}}
    return d;
  },
  s(k,v){
    const str=JSON.stringify(v);
    _mem[k]=str; // always keep in memory
    try{localStorage.setItem('nx2_'+k,str);}catch(e){}
  },
  clear(){
    ['subjects','plannerData','notes','studyLogs','weeklySchedule','theme','timerSettings','deletedSubjNotes'].forEach(k=>{
      delete _mem[k];
      try{localStorage.removeItem('nx2_'+k);}catch(e){}
    });
  }
};



const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}; // local date, not UTC — avoids the day rolling over hours early/late depending on timezone
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');


function attachmentIsAllowedFile(file){
  if(!file) return false;
  const name=String(file.name||'').toLowerCase();
  const type=String(file.type||'').toLowerCase();
  if(type.startsWith('image/')) return true;
  if(type==='application/pdf' || type==='text/plain') return true;
  return /\.(pdf|txt|png|jpe?g|webp|gif|bmp|svg)$/i.test(name);
}
function escText(s){ return esc(s||'').replace(/\n/g,'<br/>'); }
const URL_RE=/((https?:\/\/|www\.)[^\s<>"')]+)/gi;
function extractUrlsFromText(text){
  const out=[];
  const raw=String(text||'');
  let m;
  URL_RE.lastIndex=0;
  while((m=URL_RE.exec(raw))){
    let url=m[0];
    while(url.length&&/[.,;:!?)\]]$/.test(url)) url=url.slice(0,-1);
    out.push(normalizeLinkUrl(url));
  }
  return out;
}
function noteTextHTML(text){
  const raw=String(text||'');
  let result='';
  let lastIndex=0;
  let m;
  URL_RE.lastIndex=0;
  while((m=URL_RE.exec(raw))){
    result+=escText(raw.slice(lastIndex,m.index));
    let url=m[0];
    let trail='';
    while(url.length&&/[.,;:!?)\]]$/.test(url)){ trail=url.slice(-1)+trail; url=url.slice(0,-1); }
    const href=normalizeLinkUrl(url);
    result+=`<span class="linked-url-wrap"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(url)}</a><button type="button" class="link-copy-btn" title="Copy link" onclick="event.stopPropagation();copyTextValue('${escJSAttr(href)}')">⧉</button></span>`;
    result+=escText(trail);
    lastIndex=URL_RE.lastIndex;
  }
  result+=escText(raw.slice(lastIndex));
  return result;
}
function collectLinksFromList(list,found){
  (Array.isArray(list)?list:[]).forEach(l=>{ if(l&&l.url) found.add(l.url); });
}
function collectLinksFromText(text,found){
  extractUrlsFromText(text).forEach(u=>found.add(u));
}
function collectAllLinks(){
  const found=new Set();
  (S.notes||[]).forEach(n=>{ collectLinksFromList(n.links,found); collectLinksFromText(n.text,found); });
  (S.subjects||[]).forEach(s=>(s.chapters||[]).forEach(c=>{ collectLinksFromList(c.links,found); collectLinksFromText(c.notes,found); }));
  Object.values(S.plannerData||{}).forEach(day=>{
    Object.values((day&&day.subjectNotes)||{}).forEach(entry=>{ const obj=subjectNoteObj(entry); collectLinksFromList(obj.links,found); collectLinksFromText(obj.text,found); });
  });
  vaultGet().forEach(v=>{ collectLinksFromList(v.links,found); collectLinksFromText(v.text,found); });
  return Array.from(found);
}
function legacyCopyToClipboard(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;
  ta.style.position='fixed';
  ta.style.top='0';
  ta.style.left='0';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, txt.length);
  const ok=document.execCommand('copy');
  ta.remove();
  if(!ok) throw new Error('execCommand copy failed');
}
async function copyToClipboard(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      return;
    }
  }catch(e){}
  legacyCopyToClipboard(txt);
}
async function copyAllLinks(){
  const links=collectAllLinks();
  if(!links.length){showAppToast('No links found yet.');return;}
  const text=links.join('\n');
  try{
    await copyToClipboard(text);
    showAppToast(`Copied ${links.length} link${links.length>1?'s':''} ✓`);
  }catch(e){
    showAppToast('Could not copy the links.');
  }
}
async function copyTextValue(value){
  const txt=String(value||'');
  try{
    await copyToClipboard(txt);
    showAppToast('Link copied');
  }catch(e){
    showAppToast('Could not copy this link');
  }
}
function aboutLinkRow(label,url){
  return `<div style="margin-bottom:10px"><div style="margin-bottom:6px">${label}</div><div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><a class="about-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a><button class="att-btn" type="button" onclick="copyTextValue('${escJSAttr(url)}')">Copy link</button></div></div>`;
}

function getDayData(d){
  if(!S.plannerData[d]) S.plannerData[d]={goals:[],priority:[],dontForget:[],schedule:[],subjectNotes:{},studyHours:0,studyGoal:6,water:0};
  return S.plannerData[d];
}


function escJSAttr(s){
  return String(s||'')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

function fmtFileSize(bytes){

  return (bytes/1024/1024).toFixed(bytes<10*1024*1024?2:1)+' MB';

function guessMimeFromName(name){
  const n=String(name||'').toLowerCase();
  if(n.endsWith('.pdf')) return 'application/pdf';
  if(n.endsWith('.doc')) return 'application/msword';
  if(n.endsWith('.docx')) return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  if(n.endsWith('.xls')) return 'application/vnd.ms-excel';
  if(n.endsWith('.xlsx')) return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if(n.endsWith('.ppt')) return 'application/vnd.ms-powerpoint';
  if(n.endsWith('.pptx')) return 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
  if(n.endsWith('.txt')) return 'text/plain';
  if(n.endsWith('.csv')) return 'text/csv';

  return 'application/octet-stream';
}
const ATT_DB_NAME='nx2_attachment_store';
const ATT_DB_VERSION=1;
const ATT_STORE='attachments';
let __attDbPromise=null;
function openAttachmentDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB is unavailable'));
  if(__attDbPromise) return __attDbPromise;
  __attDbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(ATT_DB_NAME, ATT_DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(ATT_STORE)) db.createObjectStore(ATT_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Failed to open attachment database'));
  });
  return __attDbPromise;
}
async function putAttachmentBlob(key, blob){
  const db=await openAttachmentDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATT_STORE,'readwrite');
    tx.objectStore(ATT_STORE).put(blob,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error||new Error('Failed to save attachment'));
    tx.onabort=()=>reject(tx.error||new Error('Attachment save aborted'));
  });
}
async function getAttachmentBlob(key){
  if(!key) return null;
  const db=await openAttachmentDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATT_STORE,'readonly');
    const req=tx.objectStore(ATT_STORE).get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error('Failed to load attachment'));
  });
}
async function deleteAttachmentBlob(key){
  if(!key) return false;
  const db=await openAttachmentDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATT_STORE,'readwrite');
    tx.objectStore(ATT_STORE).delete(key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error||new Error('Failed to delete attachment'));
    tx.onabort=()=>reject(tx.error||new Error('Attachment delete aborted'));
  });
}
function readFileAsArrayBufferWithProgress(file,onProgress){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onprogress=e=>{ if(onProgress && e.lengthComputable) onProgress(e.loaded,e.total); };
    fr.onload=()=>{ if(onProgress) onProgress(Number(file.size||0), Number(file.size||0)); resolve(fr.result); };
    fr.onerror=()=>reject(fr.error||new Error('Failed to read file'));
    fr.readAsArrayBuffer(file);
  });
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(fr.error||new Error('Failed to convert blob'));
    fr.readAsDataURL(blob);
  });
}
async function filesToAttachmentMeta(files,onProgress){
  const picked=Array.from((files&&files.length!==undefined)?files:[]);
  const totalFiles=picked.length;
  const totalBytes=picked.reduce((sum,file)=>sum+Number(file.size||0),0) || 1;
  const out=[];
  let loadedBytes=0;
  for(let idx=0; idx<picked.length; idx++){
    const file=picked[idx];
    const type=file.type||guessMimeFromName(file.name);
    const id=uid();
    onProgress&&onProgress({index:idx+1,totalFiles,fileName:file.name||'file',fileLoaded:0,fileTotal:Number(file.size||0),loadedBytes,totalBytes,phase:'reading'});
    try{
      const buffer=await readFileAsArrayBufferWithProgress(file,(loaded,total)=>{
        onProgress&&onProgress({index:idx+1,totalFiles,fileName:file.name||'file',fileLoaded:Number(loaded||0),fileTotal:Number(total||file.size||0),loadedBytes:loadedBytes+Number(loaded||0),totalBytes,phase:'reading'});
      });
      const blob=new Blob([buffer],{type});
      await putAttachmentBlob(id, blob);
      loadedBytes+=Number(file.size||blob.size||0);
      onProgress&&onProgress({index:idx+1,totalFiles,fileName:file.name||'file',fileLoaded:Number(file.size||blob.size||0),fileTotal:Number(file.size||blob.size||0),loadedBytes,totalBytes,phase:'stored'});
      out.push({
        id,
        blobKey:id,
        storage:'idb',
        name:file.name||'file',
        type,
        size:Number(file.size||blob.size||0),
        isImage:/^image\//i.test(type),
        addedAt:new Date().toISOString()
      });
    }catch(err){
      const fallbackBlob=file.slice ? file.slice(0,file.size,type) : new Blob([await readFileAsArrayBufferWithProgress(file)],{type});
      const fallbackDataUrl=await blobToDataURL(fallbackBlob);
      loadedBytes+=Number(file.size||fallbackBlob.size||0);
      onProgress&&onProgress({index:idx+1,totalFiles,fileName:file.name||'file',fileLoaded:Number(file.size||fallbackBlob.size||0),fileTotal:Number(file.size||fallbackBlob.size||0),loadedBytes,totalBytes,phase:'fallback'});
      out.push({
        id,
        storage:'inline',
        name:file.name||'file',
        type,
        size:Number(file.size||fallbackBlob.size||0),
        isImage:/^image\//i.test(type),
        dataUrl:fallbackDataUrl,
        addedAt:new Date().toISOString()
      });
    }
  }
  onProgress&&onProgress({index:totalFiles,totalFiles,fileName:totalFiles?picked[totalFiles-1].name:'',fileLoaded:0,fileTotal:0,loadedBytes:totalBytes,totalBytes,phase:'done'});
  return out;
}

function dataUrlToBlob(dataUrl){
  const parts=String(dataUrl||'').split(',');
  if(parts.length<2) return new Blob([],{type:'application/octet-stream'});
  const mime=((parts[0].match(/data:([^;]+)/)||[])[1])||'application/octet-stream';
  const bin=atob(parts[1]);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function resolveAttachmentBlob(att){
  if(!att) return null;
  if(att.dataUrl){
    const blob=dataUrlToBlob(att.dataUrl);
    if((!att.blobKey||att.storage!=='idb') && 'indexedDB' in window){
      try{
        att.blobKey=att.blobKey||att.id||uid();
        await putAttachmentBlob(att.blobKey, blob);
        att.storage='idb';
        delete att.dataUrl;
      }catch(e){}
    }
    return blob;
  }
  if(att.blobKey||att.storage==='idb') return await getAttachmentBlob(att.blobKey||att.id);
  return null;
}

  if(type.includes('pdf')||name.endsWith('.pdf')) return '📄';

  if(type.includes('sheet')||name.endsWith('.xls')||name.endsWith('.xlsx')||name.endsWith('.csv')) return '📊';

async function attHydratePendingThumbs(){

function noteContextForTarget(target,a,b){

      const subj=S.subjects.find(s=>s.id===a);
      const ch=subj&&subj.chapters.find(c=>c.id===b);
      const place=(subj&&ch)?(subj.name+' - '+ch.name):(ch?ch.name:'Chapter');
      return {place, text:'', tags:[]};
    }
    if(target==='subjectNote'){

    }
    if(target==='note'){

    }
    if(target==='vault'){
      const vault=vaultGet();
      const note=vault.find(v=>v.id===a);

    }
  }catch(e){}

function noteContextHeader(ctx){

function applyAttachmentImageTransform(){
  const img=document.getElementById('attachment-preview-image');
  const wrap=document.getElementById('attachment-preview-image-wrap');
  if(!img||!wrap) return;
  const scale=Math.max(1,Number(wrap.dataset.scale||1));
  const tx=Number(wrap.dataset.tx||0);
  const ty=Number(wrap.dataset.ty||0);
  img.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`;
}
function bindAttachmentImagePreview(){
  const wrap=document.getElementById('attachment-preview-image-wrap');
  const img=document.getElementById('attachment-preview-image');
  if(!wrap||!img||wrap.dataset.bound==='1') return;
  wrap.dataset.bound='1';
  wrap.dataset.scale='1';
  wrap.dataset.tx='0';
  wrap.dataset.ty='0';
  let startX=0,startY=0,startTx=0,startTy=0,dragging=false;
  let pinchStart=0,pinchScale=1;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  wrap.addEventListener('wheel',e=>{e.preventDefault(); const cur=Math.max(1,Math.min(5,Number(wrap.dataset.scale||1)+(e.deltaY<0?0.15:-0.15))); wrap.dataset.scale=String(cur); applyAttachmentImageTransform();},{passive:false});
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===2){ pinchStart=dist(e.touches); pinchScale=Number(wrap.dataset.scale||1); return; }
    if(e.touches.length===1){ dragging=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; startTx=Number(wrap.dataset.tx||0); startTy=Number(wrap.dataset.ty||0); }
  },{passive:false});
  wrap.addEventListener('touchmove',e=>{
    if(e.touches.length===2){ e.preventDefault(); const next=Math.max(1,Math.min(5,pinchScale*(dist(e.touches)/Math.max(1,pinchStart)))); wrap.dataset.scale=String(next); applyAttachmentImageTransform(); return; }
    if(e.touches.length===1 && dragging){ e.preventDefault(); wrap.dataset.tx=String(startTx+(e.touches[0].clientX-startX)); wrap.dataset.ty=String(startTy+(e.touches[0].clientY-startY)); applyAttachmentImageTransform(); }
  },{passive:false});
  wrap.addEventListener('touchend',()=>{ dragging=false; });
  wrap.addEventListener('mousedown',e=>{ dragging=true; startX=e.clientX; startY=e.clientY; startTx=Number(wrap.dataset.tx||0); startTy=Number(wrap.dataset.ty||0); });
  window.addEventListener('mousemove',e=>{ if(!dragging) return; wrap.dataset.tx=String(startTx+(e.clientX-startX)); wrap.dataset.ty=String(startTy+(e.clientY-startY)); applyAttachmentImageTransform(); });
  window.addEventListener('mouseup',()=>{ dragging=false; });
}

  const [removed]=ref.list.splice(idx,1);
  ref.persist();
  ref.rerender();
  if(__attScreenCtx && __attScreenCtx.target===target && __attScreenCtx.a===a && __attScreenCtx.b===b) openAttachmentManager(target,a,b);
  closeAttachmentPreview();
  showAppToast('Attachment removed');
  try{ if(removed && removed.blobKey) await deleteAttachmentBlob(removed.blobKey); }catch(e){}
}

async function migrateLegacyAttachmentsInBackground(){
  let changed=false;
  let vaultChanged=false;
  const vault=vaultGet();
  const owners=[];
  const addOwner=owner=>{ if(owner && Array.isArray(owner.attachments)) owners.push(owner); };
  (S.notes||[]).forEach(addOwner);
  Object.values(S.plannerData||{}).forEach(day=>{
    if(day && day.subjectNotes){
      Object.values(day.subjectNotes).forEach(addOwner);
    }
  });
  (vault||[]).forEach(owner=>{ if(owner && Array.isArray(owner.attachments)){ owners.push(owner); vaultChanged=true; } });
  (S.subjects||[]).forEach(subj=>{
    (subj.chapters||[]).forEach(addOwner);
  });
  for(const owner of owners){
    const atts=owner.attachments;
    for(const att of atts){
      if(att && att.dataUrl && (!att.blobKey || att.storage!=='idb')){
        try{
          const blob=dataUrlToBlob(att.dataUrl);
          att.blobKey=att.blobKey||att.id||uid();
          await putAttachmentBlob(att.blobKey, blob);
          att.storage='idb';
          delete att.dataUrl;
          changed=true;
        }catch(e){}
      }
    }
  }
  if(changed){
    save();
    if(vaultChanged) vaultSave(vault);
  }
}

let myFilesPath=[]; // array of folder ids from root to current folder
function mfFindFolder(nodes,id){
  for(const n of (nodes||[])){
    if(n.id===id) return n;
    const inner=mfFindFolder(n.folders,id);
    if(inner) return inner;
  }
  return null;
}
function mfCurrentContainer(){
  let arr=S.myFiles, node=null;
  for(const id of myFilesPath){
    const found=(arr||[]).find(f=>f.id===id);
    if(!found){ myFilesPath=[]; return {folders:S.myFiles, node:null}; }
    node=found;
    if(!Array.isArray(node.folders)) node.folders=[];
    if(!Array.isArray(node.items)) node.items=[];
    arr=node.folders;
  }
  return {folders:arr, node};
}

function mfMoveFolderTo(targetFolderId){
  if(!__mfMoveCtx) return;
  const ctx=__mfMoveCtx;
  const isRoot=targetFolderId==='__ROOT__';
  let targetArr;
  if(isRoot){
    targetArr=S.myFiles;
  } else {
    const targetFolder=mfFindFolder(S.myFiles,targetFolderId);
    if(!targetFolder) return;
    if(!Array.isArray(targetFolder.folders)) targetFolder.folders=[];
    targetArr=targetFolder.folders;
  }
  const {folders}=mfCurrentContainer();
  let moved=0;
  if(ctx.kind==='folder'){
    const idx=(folders||[]).findIndex(f=>f.id===ctx.itemId);
    if(idx>=0){ const [f]=folders.splice(idx,1); targetArr.push(f); moved++; }
  } else if(ctx.kind==='folder-bulk'){
    const ids=new Set(ctx.itemIds);
    for(let i=(folders||[]).length-1;i>=0;i--){
      const f=folders[i];
      if(ids.has(f.id)){ folders.splice(i,1); targetArr.push(f); moved++; }
    }
  }
  save();
  __mfMoveCtx=null;
  if(ctx.kind==='folder-bulk') mfExitFolderSelect();
  closeM();
  rMyFiles();
  showAppToast(`${moved} folder(s) moved`);
}

function mfCopyFolderTo(targetFolderId){
  if(!__mfCopyCtx) return;
  const ctx=__mfCopyCtx;
  const isRoot=targetFolderId==='__ROOT__';
  let targetArr;
  if(isRoot){
    targetArr=S.myFiles;
  } else {
    const targetFolder=mfFindFolder(S.myFiles,targetFolderId);
    if(!targetFolder) return;
    if(!Array.isArray(targetFolder.folders)) targetFolder.folders=[];
    targetArr=targetFolder.folders;
  }
  const {folders}=mfCurrentContainer();
  let copied=0;
  if(ctx.kind==='folder'){
    const src=(folders||[]).find(f=>f.id===ctx.itemId);
    if(src){ targetArr.push(mfCloneFolder(src)); copied++; }
  } else if(ctx.kind==='folder-bulk'){
    const ids=new Set(ctx.itemIds);
    (folders||[]).forEach(f=>{ if(ids.has(f.id)){ targetArr.push(mfCloneFolder(f)); copied++; } });
  }
  save();
  __mfCopyCtx=null;
  if(ctx.kind==='folder-bulk') mfExitFolderSelect();
  closeM();
  rMyFiles();
  showAppToast(`${copied} folder(s) copied`);
}

function mfSearchTree(query){
  const q=(query||'').trim().toLowerCase();
  if(!q) return [];
  const results=[];
  function walk(nodes,ancestorIds){
    for(const f of (nodes||[])){
      const selfPath=[...ancestorIds,f.id];
      if((f.name||'').toLowerCase().includes(q)){
        results.push({type:'folder',id:f.id,name:f.name,kind:f.kind,fav:!!f.fav,jumpPath:selfPath});
      }
      (f.items||[]).forEach(it=>{
        if(f.kind==='links'){
          if((it.name||'').toLowerCase().includes(q)||(it.url||'').toLowerCase().includes(q)){
            results.push({type:'link',id:it.id,name:it.name||it.url,url:it.url,fav:!!it.fav,jumpPath:selfPath});
          }
        } else {
          const noteMatch=(it.note||'').toLowerCase().includes(q);
          if((it.name||'').toLowerCase().includes(q)||noteMatch){
            results.push({type:'file',id:it.id,name:it.name,note:it.note,noteMatch,fav:!!it.fav,isImage:attachmentKind(it)==='image',att:it,jumpPath:selfPath});
          }
        }
      });
      walk(f.folders,selfPath);
    }
  }
  walk(S.myFiles,[]);
  return results;
}
function mfCollectFavorites(){
  const results=[];
  function walk(nodes,ancestorIds){
    for(const f of (nodes||[])){
      const selfPath=[...ancestorIds,f.id];
      if(f.fav){
        results.push({type:'folder',id:f.id,name:f.name,kind:f.kind,fav:true,jumpPath:selfPath});
      }
      (f.items||[]).forEach(it=>{
        if(it.fav){
          results.push({type:f.kind==='links'?'link':'file',id:it.id,name:it.name||it.url,url:it.url,note:it.note,isImage:f.kind!=='links'&&attachmentKind(it)==='image',att:f.kind!=='links'?it:null,fav:true,jumpPath:selfPath});
        }
      });
      walk(f.folders,selfPath);
    }
  }
  walk(S.myFiles,[]);
  return results;
}

// ---- download a My-Files folder (or several) as a real folder, via .zip ----
function mfSanitizeName(name){
  return String(name||'file').replace(/[\\\/:*?"<>|]/g,'_').trim()||'file';
}
async function mfAddFolderToZip(zipFolder, folder){
  if(folder.kind==='links'){
    const items=(folder.items||[]);
    if(items.length){
      const lines=items.map(l=>`${l.name||l.url}\n${l.url}`).join('\n\n');
      zipFolder.file('links.txt', lines);
    }
  } else {
    for(const att of (folder.items||[])){
      try{
        const blob=await resolveAttachmentBlob(att);
        if(blob) zipFolder.file(mfSanitizeName(att.name||'file'), blob);
      }catch(e){}
    }
  }
  for(const sub of (folder.folders||[])){
    const subZip=zipFolder.folder(mfSanitizeName(sub.name||'folder'));
    await mfAddFolderToZip(subZip, sub);
  }
}
function mfSaveZipBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function mfDownloadFoldersAsZip(folders){
  if(!folders||!folders.length) return;
  if(typeof JSZip==='undefined'){ showAppToast('Zip export is unavailable right now.'); return; }
  showAppToast('Preparing download…');
  try{
    const zip=new JSZip();
    for(const folder of folders){
      const root=zip.folder(mfSanitizeName(folder.name||'folder'));
      await mfAddFolderToZip(root, folder);
    }
    const blob=await zip.generateAsync({type:'blob'});
    mfSaveZipBlob(blob, folders.length===1?mfSanitizeName(folders[0].name||'folder')+'.zip':'folders.zip');
    showAppToast('Saved as a zip — extract it to get a real folder with everything inside.');
  }catch(e){
    showAppToast('Could not prepare the folder(s) for download.');
  }
}
function mfDownloadFolderAsZip(folderId){
  const folder=mfFindFolder(S.myFiles, folderId);
  if(!folder) return;
  mfDownloadFoldersAsZip([folder]);
}
function mfDownloadSelectedFoldersAsZip(){
  const {folders}=mfCurrentContainer();
  if(!folders||!__mfFolderSelect.ids.size) return;
  const selected=folders.filter(f=>__mfFolderSelect.ids.has(f.id));
  mfDownloadFoldersAsZip(selected);
  mfExitFolderSelect();
}
async function mfDownloadAllFoldersAsZip(){
  const {folders}=mfCurrentContainer();
  if(!folders||!folders.length){ showAppToast('No folders to download.'); return; }
  await mfDownloadFoldersAsZip(folders);
}

  const nameEl=document.getElementById('mf-link-name');

  const rawUrl=(urlEl&&urlEl.value||'').trim();
  if(!rawUrl){ showAppToast('Add a link URL first.'); return; }
  const url=normalizeLinkUrl(rawUrl);
  const name=(nameEl&&nameEl.value||'').trim()||url;
  node.items.push({id:uid(), name, url});
  save();
  if(nameEl) nameEl.value='';
  if(urlEl) urlEl.value='';

async function mfAddFiles(input){
  if(!input||!input.files||!input.files.length) return;
  const {node}=mfCurrentContainer();
  if(!node){ try{input.value='';}catch(e){} return; }
  const picked=Array.from(input.files||[]);
  const allowed=picked.filter(attachmentIsAllowedFile);
  const rejected=picked.length-allowed.length;
  if(!allowed.length){ tAlert('Only PDF, TXT, and image files are supported.'); try{input.value='';}catch(e){} return; }
  openAttachmentUploadProgress();
  try{
    const metas=await filesToAttachmentMeta(allowed, updateAttachmentUploadProgress);
    closeAttachmentUploadProgress();
    node.items.push(...metas);
    save();
    rMyFiles();
    showAppToast(metas.length+' file'+(metas.length>1?'s':'')+' added'+(rejected?` · ${rejected} skipped`:''));
  }catch(err){
    closeAttachmentUploadProgress();
    tAlert('Could not add the selected file(s).');
  }finally{
    try{input.value='';}catch(e){}
  }
}

  try{
    const blob=await resolveAttachmentBlob(att);

async function mfShareFileIds(ids){
  const {node}=mfCurrentContainer();
  if(!node) return;
  const idSet=new Set(ids);
  const atts=(node.items||[]).filter(x=>idSet.has(x.id));
  if(!atts.length) return;
  if(atts.length>1){
    if(typeof JSZip==='undefined'){ showAppToast('Zip export is unavailable right now.'); return; }
    showAppToast('Preparing files…');
    try{
      const zip=new JSZip();
      const usedNames=new Set();
      let ok=0;
      for(const att of atts){
        try{
          const blob=await resolveAttachmentBlob(att);
          if(!blob) continue;
          let name=mfSanitizeName(att.name||'file');
          if(usedNames.has(name)){
            const dot=name.lastIndexOf('.');
            const base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
            let i=2; while(usedNames.has(base+'-'+i+ext)) i++;
            name=base+'-'+i+ext;
          }
          usedNames.add(name);
          zip.file(name, blob);
          ok++;
        }catch(e){}
      }
      if(!ok){ showAppToast('Could not prepare the files to share.'); return; }
      const blob=await zip.generateAsync({type:'blob'});
      const zipName=mfSanitizeName(node.name||'files')+'.zip';
      try{
        const file=new File([blob], zipName, {type:'application/zip'});
        if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
          try{ await navigator.share({files:[file], title:'Files'}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
        }
      }catch(e){}
      // Share stays distinct from Download: no silent save-to-device fallback here.
      for(const att of atts){ await openAttachmentBlob(att); }
      showAppToast('Files opened in new tabs — sharing multiple files at once isn\'t supported here.');
    }catch(e){
      showAppToast('Could not share these files.');
    }
    return;
  }
  try{
    const files=[];
    for(const att of atts){
      const blob=await resolveAttachmentBlob(att);
      if(blob) files.push(new File([blob], att.name||'file', {type:att.type||blob.type||'application/octet-stream'}));
    }
    if(!files.length){ showAppToast('Could not prepare files to share.'); return; }
    if(navigator.share && (!navigator.canShare || navigator.canShare({files}))){
      try{ await navigator.share({files, title:'Files'}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
    }
    for(const att of atts){ await openAttachmentBlob(att); }
    showAppToast('Files opened in new tabs — sharing multiple files at once isn\'t supported here.');
  }catch(e){
    showAppToast('Could not share these files.');
  }
}
async function mfDownloadFileIds(ids){
  const {node}=mfCurrentContainer();
  if(!node) return;
  const idSet=new Set(ids);
  const atts=(node.items||[]).filter(x=>idSet.has(x.id));
  if(!atts.length) return;
  if(atts.length>1){
    if(typeof JSZip==='undefined'){ showAppToast('Zip export is unavailable right now.'); return; }
    showAppToast('Preparing download…');
    try{
      const zip=new JSZip();
      const usedNames=new Set();
      let ok=0;
      for(const att of atts){
        try{
          const blob=await resolveAttachmentBlob(att);
          if(!blob) continue;
          let name=mfSanitizeName(att.name||'file');
          if(usedNames.has(name)){
            const dot=name.lastIndexOf('.');
            const base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
            let i=2; while(usedNames.has(base+'-'+i+ext)) i++;
            name=base+'-'+i+ext;
          }
          usedNames.add(name);
          zip.file(name, blob);
          ok++;
        }catch(e){}
      }
      if(!ok){ showAppToast('Could not prepare the files for download.'); return; }
      const blob=await zip.generateAsync({type:'blob'});
      mfSaveZipBlob(blob, mfSanitizeName(node.name||'files')+'.zip');
      showAppToast('Saved '+ok+' file'+(ok>1?'s':'')+' as a zip.');
    }catch(e){
      showAppToast('Could not prepare the files for download.');
    }
    return;
  }
  let ok=0;
  for(const att of atts){
    try{
      const blob=await resolveAttachmentBlob(att);
      if(!blob) continue;
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url; link.download=att.name||'file';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(e){} },60000);
      ok++;
    }catch(e){}
  }
  showAppToast('Saved '+ok+' file'+(ok>1?'s':'')+' to your device.');
}

let __mfMoveCtx=null;
function mfCollectFoldersOfKind(nodes,kind,excludeId,path,out){
  for(const f of (nodes||[])){
    const label=[...path,f.name].join(' › ');
    if(f.kind===kind && f.id!==excludeId) out.push({id:f.id,label});
    mfCollectFoldersOfKind(f.folders,kind,excludeId,[...path,f.name],out);
  }
  return out;
}
function mfMoveItemPrompt(kind,itemId){
  const {node}=mfCurrentContainer();
  if(!node) return;
  __mfMoveCtx={kind,itemId,fromFolderId:node.id,bulk:false};
  const tree=mfPickerTreeHTML(S.myFiles,kind,new Set([node.id]),'mfMoveItemTo');
  openM(`<h3 style="font-weight:700;margin-bottom:14px">Move to folder</h3><div style="max-height:50vh;overflow:auto">${mfPickerNewFolderBtnHTML(kind,'mfMoveItemTo')}${tree}</div><div style="margin-top:12px"><button class="btn btn-n" type="button" onclick="closeM()">Cancel</button></div>`);

function mfMoveItemTo(targetFolderId){
  if(!__mfMoveCtx) return;
  const {kind,itemId,itemIds,fromFolderId,bulk}=__mfMoveCtx;
  const fromFolder=mfFindFolder(S.myFiles,fromFolderId);
  const targetFolder=mfFindFolder(S.myFiles,targetFolderId);
  if(!fromFolder||!targetFolder) return;
  if(!Array.isArray(targetFolder.items)) targetFolder.items=[];
  const ids=bulk?itemIds:[itemId];
  let moved=0;
  ids.forEach(id=>{
    const idx=fromFolder.items.findIndex(x=>x.id===id);
    if(idx>=0){ const [item]=fromFolder.items.splice(idx,1); targetFolder.items.push(item); moved++; }
  });
  save();
  __mfMoveCtx=null;
  if(bulk){ if(kind==='links') mfExitLinkSelect(); else mfExitFileSelect(); }
  closeM();
  rMyFiles();
  showAppToast(kind==='links'?`${moved} link(s) moved`:`${moved} file(s) moved`);
}

function fmtSecs(s){
  s=Math.floor(s||0);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
  if(m>0) return `${m}m ${String(sec).padStart(2,'0')}s`;
  return `${sec}s`;
}
function fmtSecsHMS(s){
  s=Math.floor(s||0);
  return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function fmtDate(d){
  try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}
}
function dateRange(start,end){
  const dates=[];let d=new Date(start+'T12:00:00');const e=new Date(end+'T12:00:00');
  while(d<=e){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  return dates;
}

    __mfSearchQuery='';
    mfResetTransientState();
  }
  if(curTab==='lib' && tab!=='lib'){
    libView={mode:'list'};
  }
  // Leaving these screens clears any active search/date filter, so coming back
  // later always starts from the full, unfiltered view rather than wherever the
  // filter was left.
  if(curTab==='notes' && tab!=='notes'){
    notesSearch='';
    notesDateFilter=null;
    notesRangeFilter=null;
  }
  if(curTab==='vault' && tab!=='vault'){
    _vaultSearch='';
    _vaultFilterDate='';
  }
  if(curTab==='focus' && tab!=='focus'){
    timerState.statsFilter='all';
    timerState.statsDates=null;
  }
  if(curTab==='home' && tab!=='home'){
    homeDate=todayStr();
  }
  if(curTab==='myfiles' && tab!=='myfiles'){
    __mfSearchQuery='';
  }
  curTab=tab; closeM();
  window.scrollTo(0,0);
  render(tab);
}
function render(tab){
  if(tab==='home') rHome();
  else if(tab==='notes') rNotes();
  else if(tab==='lib') rLib();
  else if(tab==='ledger') rLedger();
  else if(tab==='myfiles') rMyFiles();
  else if(tab==='prog') rProg();
  else if(tab==='focus') rFocus();
  else if(tab==='sched') rSched();
  else if(tab==='about') rAbout();
  else if(tab==='vault') rVault();
}

// Custom time picker — replaces native <input type="time">, whose OS-rendered dialog
// (Chromium's DateTimeChooserAndroid) can clip its own "SET" button on some devices/
// font-size settings. This uses the app's own modal system instead, so it renders
// identically everywhere. targetId must be the id of a readonly text field holding
// the current "HH:MM" (24h) value; confirming writes the new value back into that
// same field in that same 24h format — schedules sort entries by comparing this
// string directly (scheduleSortVal), so that format must stay exactly "HH:MM".
function openTimePicker(targetId,label){
  const inputEl=document.getElementById(targetId);
  const cur=(inputEl&&inputEl.value)||'';
  let h24=9,m=0;
  if(/^\d{2}:\d{2}$/.test(cur)){h24=+cur.slice(0,2);m=+cur.slice(3,5);}
  const isPM=h24>=12;
  let h12=h24%12; if(h12===0)h12=12;
  const hOpts=Array.from({length:12},(_,i)=>{const v=i+1;return `<option value="${v}" ${v===h12?'selected':''}>${String(v).padStart(2,'0')}</option>`;}).join('');
  const mOpts=Array.from({length:60},(_,i)=>`<option value="${i}" ${i===m?'selected':''}>${String(i).padStart(2,'0')}</option>`).join('');
  openM(`
    <div class="card" style="max-width:300px;margin:0 auto">
      <div style="font-weight:700;font-size:15px;margin-bottom:16px;text-align:center">${label||'Select time'}</div>
      <div dir="ltr" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px">
        <select id="tp-hour" class="inp" style="width:74px;text-align:center;font-size:20px;font-weight:700">${hOpts}</select>
        <div style="font-size:20px;font-weight:700">:</div>
        <select id="tp-min" class="inp" style="width:74px;text-align:center;font-size:20px;font-weight:700">${mOpts}</select>
      </div>
      <div dir="ltr" style="display:flex;gap:8px;justify-content:center;margin-bottom:22px">
        <button type="button" id="tp-am" class="btn" style="min-width:64px;background:${isPM?'rgba(0,0,0,.08)':'var(--sage)'};color:${isPM?'var(--text)':'#fff'}" onclick="setTimePickerPeriod('AM')">AM</button>
        <button type="button" id="tp-pm" class="btn" style="min-width:64px;background:${isPM?'var(--sage)':'rgba(0,0,0,.08)'};color:${isPM?'#fff':'var(--text)'}" onclick="setTimePickerPeriod('PM')">PM</button>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn" type="button" style="background:rgba(0,0,0,.08);color:var(--text)" onclick="closeM()">Cancel</button>
        <button class="btn btn-p" type="button" onclick="confirmTimePicker('${targetId}')">Set</button>
      </div>
    </div>
  `);
  document.getElementById('tp-hour').dataset.period=isPM?'PM':'AM';
}
function setTimePickerPeriod(period){
  const hourSel=document.getElementById('tp-hour');
  if(!hourSel) return;
  hourSel.dataset.period=period;
  const amBtn=document.getElementById('tp-am'),pmBtn=document.getElementById('tp-pm');
  const isPM=period==='PM';
  amBtn.style.background=isPM?'rgba(0,0,0,.08)':'var(--sage)'; amBtn.style.color=isPM?'var(--text)':'#fff';
  pmBtn.style.background=isPM?'var(--sage)':'rgba(0,0,0,.08)'; pmBtn.style.color=isPM?'#fff':'var(--text)';
}
function confirmTimePicker(targetId){
  const hourSel=document.getElementById('tp-hour');
  let h12=+hourSel.value;
  const m=+document.getElementById('tp-min').value;
  const isPM=hourSel.dataset.period==='PM';
  let h24=h12%12; if(isPM) h24+=12;
  const el=document.getElementById(targetId);
  if(el) el.value=String(h24).padStart(2,'0')+':'+String(m).padStart(2,'0');
  closeM();
}

function ringH(pct,size,stroke,color,label){
  pct=Math.min(100,Math.max(0,Math.round(pct||0)));
  const r=(size-stroke)/2,circ=r*2*Math.PI,off=circ-(pct/100)*circ;
  return `<div class="ring-wrap">
    <div style="position:relative;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;">
      <svg width="${size}" height="${size}" style="transform:rotate(-90deg);position:absolute;">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(0,0,0,.1)" stroke-width="${stroke}" fill="none"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
      </svg>
      <span style="font-size:${size>80?13:11}px;font-weight:700;color:var(--text)">${pct}%</span>
    </div>
    ${label?`<span class="ring-lbl">${label}</span>`:''}
  </div>`;
}

}

function plannedDates(){
  return Object.keys(S.plannerData||{}).filter(ds=>{
    const d=S.plannerData[ds];
    if(!d) return false;
    return (d.goals&&d.goals.length)||(d.priority&&d.priority.length)||(d.dontForget&&d.dontForget.length)||(d.schedule&&d.schedule.length)||(d.studyHours>0)||(d.water>0)||(d.subjectNotes&&Object.values(d.subjectNotes).some(v=>{const note=subjectNoteObj(v);return (note.text&&note.text.trim())||(note.attachments&&note.attachments.length)||(note.links&&note.links.length);}));
  });
}
let CAL={y:0,m:0,mode:'',marked:[],cb:null,sel1:null};
function openCal(mode,marked,cb,noFuture){
  const d=new Date();
  CAL={y:d.getFullYear(),m:d.getMonth(),mode,marked:marked||[],cb,sel1:null,noFuture:!!noFuture};
  renderCal();
}
function calNav(dir){CAL.m+=dir;if(CAL.m>11){CAL.m=0;CAL.y++;}if(CAL.m<0){CAL.m=11;CAL.y--;}renderCal();}
function renderCal(){
  const {y,m,marked,mode,sel1,noFuture}=CAL;
  const fd=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const today=new Date();
  const todayDs=todayStr();
  const mn=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // monthly study total for study mode
  let mTotal=0;
  if(mode==='study'){
    S.studyLogs.forEach(l=>{
      if(l.date&&l.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)) mTotal+=(l.duration||0);
    });
  }

  let cells='';
  for(let i=0;i<fd;i++) cells+=`<div></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isTod=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const hasMark=marked.includes(ds)||(mode==='study'&&S.studyLogs.some(l=>l.date===ds));
    const isSel=sel1===ds;
    const isFuture=noFuture&&ds>todayDs;
    let studyLine='';
    if(mode==='study'){
      const sec=S.studyLogs.filter(l=>l.date===ds).reduce((a,l)=>a+(l.duration||0),0);
      if(sec>0) studyLine=`<div class="cal-study-time">${fmtSecsHMS(sec)}</div>`;
    }
    cells+=`<div class="cal-dc${isTod?' today':''}${isSel?' sel1':''}${isFuture?' cal-dc-disabled':''}" ${isFuture?'':`onclick="calClick('${ds}')"`} style="${isFuture?'opacity:.32;pointer-events:none':''}">
      <div class="inner">${d}</div>
      ${studyLine}
      ${hasMark&&mode!=='study'?`<div style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:${isTod?'#fff':'var(--accent)'};box-shadow:0 0 0 1px rgba(0,0,0,.08)"></div>`:''}
    </div>`;
  }

  const hint=noFuture?'Tap a date (today or earlier)':
             mode==='home'?'Tap a date to plan it':
             mode==='notes-filter'?'Tap start then end date for range, or tap once for single day':
             mode==='study'?'Tap a day to see session details':'Tap a date';

  openM(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button onclick="calNav(-1)" style="background:none;border:none;cursor:pointer;padding:6px;color:var(--text)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div style="text-align:center">
        <div style="font-weight:700;color:var(--text)">${mn}</div>
        ${mode==='study'&&mTotal>0?`<div style="font-size:11px;color:var(--sage);margin-top:2px">Month total: ${fmtSecs(mTotal)}</div>`:''}
      </div>
      <button onclick="calNav(1)" style="background:none;border:none;cursor:pointer;padding:6px;color:var(--text)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button onclick="closeM()" style="background:none;border:none;cursor:pointer;padding:6px">${xIcon()}</button>
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px">${hint}${sel1?` · Start: ${sel1}`:''}</div>
    <div class="cal-grid" dir="ltr">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dh">${d}</div>`).join('')}
      ${cells}
    </div>
    <button onclick="closeM()" class="btn btn-n" style="width:100%;margin-top:14px">Close</button>
  `);
}
function calClick(ds){
  const {mode,cb,noFuture}=CAL;
  if(noFuture&&ds>todayStr())return;
  if(mode==='home'){closeM();if(cb)cb(ds);}
  else if(mode==='study'){
    const secs=S.studyLogs.filter(l=>l.date===ds).reduce((a,l)=>a+(l.duration||0),0);
    const sessions=S.studyLogs.filter(l=>l.date===ds);
    openM(`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="font-weight:700">${fmtDate(ds)}</h3>
        <button onclick="openCal('study')" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--sage);font-family:inherit">← Back</button>
      </div>
      <div style="font-size:15px;font-weight:700;color:var(--sage);margin-bottom:12px">Total: ${fmtSecs(secs)}</div>
      ${sessions.length===0?'<div class="empty">No sessions on this day.</div>':
        sessions.map(s=>`<div class="log-row"><div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(s.subject)}</div><div style="font-size:11px;color:var(--muted)">${fmtSecs(s.duration)}</div></div></div>`).join('')}
      <button onclick="closeM()" class="btn btn-p" style="width:100%;margin-top:14px">Close</button>
    `);
  }
  else if(mode==='notes-filter'){
    if(!CAL.sel1){CAL.sel1=ds;renderCal();}
    else if(CAL.sel1===ds){closeM();if(cb)cb(ds,ds);}
    else{const s=CAL.sel1<ds?CAL.sel1:ds,e=CAL.sel1<ds?ds:CAL.sel1;closeM();if(cb)cb(s,e);}
  }
  else{closeM();if(cb)cb(ds);}
}

function to12h(hhmm){
  if(!hhmm) return '';
  const parts=String(hhmm).split(':'); let h=parseInt(parts[0],10); const m=parts[1]||'00';
  if(isNaN(h)) return hhmm;
  const ap=h>=12?'PM':'AM';
  h=h%12; if(h===0)h=12;
  return h+':'+m+' '+ap;
}
function scheduleTimeLabel(start,end){
  if(start&&end) return to12h(start)+' \u2013 '+to12h(end);
  if(start) return to12h(start);
  return '';
}
function scheduleSortVal(entry){
  // Sorting by start time alone leaves entries with an identical start time in
  // whatever order they happened to be added, which looks wrong once two sessions
  // share a start time but end at different points. Appending the end time makes
  // the comparison sort by start time first, then by end time (earlier-ending first).
  const start=(entry&&(entry.startTime||entry.time))||'00:00';
  const end=(entry&&entry.endTime)||'00:00';
  return start+end;
}
let editingSchedId=null;
function hSchedHTML(sched){
  if(!sched.length) return '<div class="empty">No schedule entries yet.</div>';
  return sched.sort((a,b)=>scheduleSortVal(a).localeCompare(scheduleSortVal(b))).map(it=>{
    if(editingSchedId===it.id){
      return `<div style="background:rgba(255,255,255,.7);border-radius:12px;padding:12px;margin-bottom:9px">
        <div dir="ltr" style="display:flex;gap:8px;margin-bottom:7px"><input type="text" inputmode="none" readonly class="inp" id="es-time-start-${it.id}" value="${esc(it.startTime||'')}" placeholder="--:--" style="flex:1;cursor:pointer" onclick="openTimePicker('es-time-start-${it.id}','Start time')"/><input type="text" inputmode="none" readonly class="inp" id="es-time-end-${it.id}" value="${esc(it.endTime||'')}" placeholder="--:--" style="flex:1;cursor:pointer" onclick="openTimePicker('es-time-end-${it.id}','End time')"/></div>

function syncSubjNoteToTimeline(sid,val,attachmentsOverride,linksOverride){
  const data=getDayData(homeDate);
  const entry=ensureSubjectNoteEntry(data,sid);
  entry.text=val||'';
  if(Array.isArray(attachmentsOverride)) entry.attachments=cloneAttachments(attachmentsOverride);
  if(Array.isArray(linksOverride)) entry.links=cloneLinks(linksOverride);
  const subj=S.subjects.find(s=>s.id===sid);
  const subjName=subj?subj.name:'Subject';
  const atts=cloneAttachments(entry.attachments||[]);
  const lks=cloneLinks(entry.links||[]);
  const isEmpty=!entry.text.trim()&&!atts.length&&!lks.length;
  if(!isEmpty){
    // Writing content back (text, a file, or a link) after the note was previously
    // deleted counts as restoring it — clear the deletion marker for this subject+date
    // so it stays fully in sync (and isn't skipped by refreshNotes() later) instead of
    // leaving a stale "deleted" flag behind that no longer matches reality.
    const deleted=LS.g('deletedSubjNotes',{});
    if(deleted[sid]&&deleted[sid].includes(homeDate)){
      deleted[sid]=deleted[sid].filter(d=>d!==homeDate);
      LS.s('deletedSubjNotes',deleted);
    }
  }
  const existing=S.notes.find(n=>n._subjId===sid&&n.date===homeDate);
  if(existing){
    if(isEmpty){ S.notes=S.notes.filter(n=>n!==existing); }
    else{ existing.text=entry.text;existing.attachments=atts;existing.links=lks;existing.updatedAt=new Date().toISOString(); }
  }else if(!isEmpty){
    S.notes.unshift({id:uid(),text:entry.text,tags:[subjName.toLowerCase().replace(/\s+/g,'-'),'home-note'],date:homeDate,createdAt:new Date().toISOString(),_subjId:sid,_subjName:subjName,attachments:atts,links:lks});
  }
  save();
}

  const data=getDayData(homeDate);
  data.studyHours=Math.max(0,+((data.studyHours||0)+d).toFixed(1));
  save();rHome();

  const data=getDayData(homeDate);
  data.studyGoal=Math.round(v*2)/2; // round to nearest 0.5
  save();rHome();
}

let notesSearch='',notesDateFilter=null,notesRangeFilter=null,currentEditingNoteId=null,currentAddingTagNoteId=null,currentEditingNoteDate=null,currentEditingNoteDraft=null;

// Updates only the results list — keyboard stays open, input untouched
function rNotesResults(){
  const el=document.getElementById('notes-results-area');
  if(!el){rNotes();return;}
  let filtered=S.notes.filter(n=>{
    const mS=!notesSearch||n.text.toLowerCase().includes(notesSearch.toLowerCase())||( n.tags||[]).some(t=>t.toLowerCase().includes(notesSearch.toLowerCase()));
    const mD=!notesDateFilter||n.date===notesDateFilter;
    const mR=!notesRangeFilter||(n.date>=notesRangeFilter[0]&&n.date<=notesRangeFilter[1]);
    return mS&&mD&&mR;
  });
  // Explicit newest-to-oldest sort — relying on array insertion order alone breaks
  // once a note's date is edited, or notes are merged in from an import, since those
  // don't naturally keep the list ordered.
  filtered=filtered.slice().sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?1:-1;
    const ta=a.createdAt?new Date(a.createdAt).getTime():0;
    const tb=b.createdAt?new Date(b.createdAt).getTime():0;
    return tb-ta;
  });
  el.innerHTML=filtered.length===0?'<div class="empty">No notes found.</div>':filtered.map(n=>noteCardHTML(n)).join('');
}

        if(deleted[sid]&&deleted[sid].includes(dateStr))return;
        const subj=S.subjects.find(s=>s.id===sid);
        const subjName=subj?subj.name:'Subject';
        const existing=S.notes.find(n=>n._subjId===sid&&n.date===dateStr);
        if(existing){
          if(isEmpty){ S.notes=S.notes.filter(n=>n!==existing); }
          else{ existing.text=val;existing.attachments=atts;existing.links=lks;existing._subjName=subjName; }
        }else if(!isEmpty){
          S.notes.unshift({id:uid(),text:val,tags:[subjName.toLowerCase().replace(/\s+/g,'-'),'home-note'],date:dateStr,createdAt:new Date().toISOString(),_subjId:sid,_subjName:subjName,attachments:atts,links:lks});

  });

async function confirmDelNote(id){
  const n=S.notes.find(n=>n.id===id);
  if(n&&n._subjId){
    const deleted=LS.g('deletedSubjNotes',{});
    if(!deleted[n._subjId])deleted[n._subjId]=[];
    if(!deleted[n._subjId].includes(n.date))deleted[n._subjId].push(n.date);
    LS.s('deletedSubjNotes',deleted);
    // Also clear the underlying home-page subject note & its attached files, since this note originated there
    const dayData=S.plannerData[n.date];
    if(dayData&&dayData.subjectNotes&&dayData.subjectNotes[n._subjId]){
      const entry=subjectNoteObj(dayData.subjectNotes[n._subjId]);
      for(const att of (entry.attachments||[])){ try{ if(att.blobKey) await deleteAttachmentBlob(att.blobKey); }catch(e){} }
      dayData.subjectNotes[n._subjId]={text:'',attachments:[],links:[]};
    }
  }
  S.notes=S.notes.filter(n=>n.id!==id);
  save();closeM();rNotesResults();
}

function toggleNoteEdit(id){
  if(currentEditingNoteId===id){currentEditingNoteId=null;currentEditingNoteDate=null;currentEditingNoteDraft=null;}
  else{

  rNotesResults();

    setTimeout(()=>{

      if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}

function _editNotePickDate(id){
  const ta=document.getElementById('note-edit-'+id);
  if(ta) currentEditingNoteDraft=ta.value;
  openCal('home',[...new Set(S.notes.map(n=>n.date))],function(d){
    currentEditingNoteDate=d;
    rNotesResults();
    setTimeout(()=>{const ta2=document.getElementById('note-edit-'+id);if(ta2)ta2.focus();},50);

function saveNoteEdit(id){
  const ta=document.getElementById('note-edit-'+id);
  if(!ta)return;
  const n=S.notes.find(n=>n.id===id);
  if(n){
    if(ta.value.trim())n.text=ta.value.trim();
    if(currentEditingNoteDate&&currentEditingNoteDate!==n.date){
      const oldDate=n.date;
      const newDate=currentEditingNoteDate;
      if(n._subjId){
        // If the new day already has a note for this subject, merge the two instead of overwriting either.
        const existingOnNewDate=S.notes.find(o=>o.id!==n.id&&o._subjId===n._subjId&&o.date===newDate);
        const oldData=S.plannerData[oldDate];
        if(oldData&&oldData.subjectNotes&&oldData.subjectNotes[n._subjId]!==undefined){
          delete oldData.subjectNotes[n._subjId];
        }
        const newData=getDayData(newDate);
        if(!newData.subjectNotes)newData.subjectNotes={};
        if(existingOnNewDate&&existingOnNewDate.text.trim()!==n.text.trim()){
          existingOnNewDate.text=existingOnNewDate.text.trim()+'\n-\n'+n.text.trim();
          existingOnNewDate.updatedAt=new Date().toISOString();
          existingOnNewDate.attachments=[...(existingOnNewDate.attachments||[]),...(n.attachments||[])];
          existingOnNewDate.links=[...(existingOnNewDate.links||[]),...(n.links||[])];
          newData.subjectNotes[n._subjId]={text:existingOnNewDate.text,attachments:cloneAttachments(existingOnNewDate.attachments||[]),links:cloneLinks(existingOnNewDate.links||[])};
          S.notes=S.notes.filter(o=>o.id!==n.id);
          currentEditingNoteId=null;currentEditingNoteDate=null;currentEditingNoteDraft=null;
          save();rNotesResults();
          return;
        }
        newData.subjectNotes[n._subjId]={text:n.text,attachments:cloneAttachments(n.attachments||[]),links:cloneLinks(n.links||[])};
      }
      n.date=newDate;
    }
  }
  if(n&&n._subjId) syncTimelineSubjectNoteToPlanner(n);
  currentEditingNoteId=null;currentEditingNoteDate=null;currentEditingNoteDraft=null;
  save();rNotesResults();
}
function cancelNoteEdit(){currentEditingNoteId=null;currentEditingNoteDate=null;currentEditingNoteDraft=null;rNotesResults();}
function startAddTag(id){
  currentAddingTagNoteId=id;currentEditingNoteId=null;
  rNotesResults();
  setTimeout(()=>{const inp=document.getElementById('tag-inp-'+id);if(inp)inp.focus();},50);
}
function saveNoteTag(id){
  const inp=document.getElementById('tag-inp-'+id);
  if(!inp||!inp.value.trim()){currentAddingTagNoteId=null;rNotesResults();return;}
  const n=S.notes.find(n=>n.id===id);
  if(n){
    if(!n.tags)n.tags=[];
    const tagVal=inp.value.trim();
    if(tagVal&&!n.tags.includes(tagVal))n.tags.push(tagVal);
  }
  currentAddingTagNoteId=null;
  // Save and force ledger sync so tags appear there too
  LS.s('notes',S.notes);
  save();
  rNotesResults();
}
function cancelNoteTag(){currentAddingTagNoteId=null;rNotesResults();}
function exportNotes(list){
  if(!list||!list.length){showAppToast('No notes to export.');return;}
  const text=list.map(n=>`[${n.date}] ${n.text}${(n.tags||[]).length?' | Tags: '+(n.tags||[]).join(', '):''}`+(n.links&&n.links.length?'\n'+linksToText(n.links,'  '):'')).join('\n');
  dlText(text,'nexus-notes.txt');
}

function exportCurrentNotes(){
  S.notes=LS.g('notes',[]);
  let filtered=S.notes.filter(n=>{
    const mS=!notesSearch||n.text.toLowerCase().includes(notesSearch.toLowerCase())||( n.tags||[]).some(t=>t.toLowerCase().includes(notesSearch.toLowerCase()));
    const mD=!notesDateFilter||n.date===notesDateFilter;
    const mR=!notesRangeFilter||(n.date>=notesRangeFilter[0]&&n.date<=notesRangeFilter[1]);
    return mS&&mD&&mR;
  });
  if(!filtered.length){showAppToast('No notes to export. Try clearing any active filters.');return;}
  const text='NEXUS — NOTES EXPORT\n'+'─'.repeat(30)+'\n\n'+
    filtered.map(n=>'['+n.date+'] '+n.text+((n.tags||[]).length?' | Tags: '+(n.tags||[]).join(', '):'')+'\n'+(n.links&&n.links.length?linksToText(n.links,'  '):'')).join('\n');
  dlText(text,'Notes Timeline.txt');
}
function dlText(text,filename){
  try{
    const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},200);
  }catch(e){
    // Fallback for browsers that block Blob download
    const w=window.open('','_blank');
    if(w){w.document.write('<pre>'+text.replace(/</g,'&lt;')+'</pre>');w.document.title=filename;}
    else{tAlert('Export: please allow popups or try again.');}
  }
}

// Detects the writing direction from the first Arabic/Latin letter in a string,
// so subject names and tag rows can follow the language they're actually written in
// (e.g. an English subject/note inside an otherwise-Arabic UI still reads left-to-right).
function _textDir(str){
  if(!str) return 'ltr';
  const m=String(str).match(/[A-Za-z\u0600-\u06FF]/);
  if(!m) return 'ltr';
  return /[\u0600-\u06FF]/.test(m[0])?'rtl':'ltr';
}
function ledgerLinksHTML(links){
  if(!links||!links.length) return '';
  return `<div class="link-list" style="margin-top:6px">${links.map(l=>`<div class="link-row"><a dir="auto" class="about-link" href="${esc(l.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0">${esc(l.name||l.url)}</a></div>`).join('')}</div>`;
}

    });

  el.innerHTML=`

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export Library

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export Timeline

      </button>
      <button onclick="libView.mode='list';go('lib')" style="padding:7px 11px;border-radius:10px;border:none;background:var(--paper);color:var(--text);font-weight:600;font-size:11px;cursor:pointer;font-family:inherit">← Library</button>
    </div>
  </div>

  <!-- Library notes by subject/chapter -->

    ${S.subjects.length===0?'<div class="empty">No subjects yet.</div>':
      S.subjects.map(subj=>{
        const chWithNotes=subj.chapters.filter(c=>(c.notes&&c.notes.trim())||(c.links&&c.links.length));
        return `<div style="margin-bottom:14px">
          <div dir="${_textDir(subj.name)}" style="font-weight:700;font-size:14px;color:${subj.color};margin-bottom:8px">${esc(subj.name)}</div>

            chWithNotes.map(ch=>`
            <div style="margin-bottom:10px;padding-left:12px;border-left:2px solid ${subj.color}55">

              ${ch.notes&&ch.notes.trim()?`<div dir="auto" style="font-size:13px;line-height:1.65">${noteTextHTML(ch.notes)}</div>`:''}
              ${ledgerLinksHTML(ch.links)}
            </div>`).join('')}
        </div>`;}).join('')}
  </div>

  <div class="card">

        <div dir="auto" style="font-size:13px;line-height:1.65;margin-bottom:6px">${noteTextHTML(n.text)}</div>
        ${ledgerLinksHTML(n.links)}
        ${(n.tags&&(n.tags||[]).length)?`<div dir="${_textDir(n.text)}" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${( n.tags||[]).map(t=>`<span class="tag-chip">#${esc(t)}</span>`).join('')}</div>`:''}
      </div>`).join('')}
  </div>`;
}

function linksToText(links,indent){
  if(!links||!links.length) return '';
  const pad=indent||'    ';
  return links.map(l=>pad+'🔗 '+(l.name||l.url)+(l.name?' — '+l.url:'')).join('\n')+'\n';
}

function exportLibraryNotes(){
  let text='NEXUS — LIBRARY NOTES\n'+'═'.repeat(40)+'\n\n';
  let hasContent=false;
  S.subjects.forEach(subj=>{
    const chWithNotes=subj.chapters.filter(c=>(c.notes&&c.notes.trim())||(c.links&&c.links.length));
    if(!chWithNotes.length)return;
    hasContent=true;
    text+='['+subj.name+']\n';
    chWithNotes.forEach(ch=>{
      text+='  • '+ch.name+':\n';
      if(ch.notes&&ch.notes.trim()) text+='    '+ch.notes.replace(/\n/g,'\n    ')+'\n';
      if(ch.links&&ch.links.length) text+=linksToText(ch.links,'    ');
      text+='\n';
    });
  });
  if(!hasContent){showAppToast('No library notes to export yet. Add notes to chapters in the Library screen.');return;}
  dlText(text,'nexus-library-notes.txt');
}

function exportTimelineNotes(){
  S.notes=LS.g('notes',[]);
  if(!S.notes.length){showAppToast('No timeline notes to export yet.');return;}
  const text=S.notes.map(n=>'['+n.date+'] '+n.text+((n.tags||[]).length?' | Tags: '+(n.tags||[]).join(', '):'')+(n.links&&n.links.length?'\n'+linksToText(n.links,'  '):'')).join('\n\n');
  dlText(text,'nexus-timeline-notes.txt');
}

function exportLedger(){
  // Always read fresh from localStorage to catch any unsaved in-memory notes
  S.notes=LS.g('notes',[]);
  const hasLib=S.subjects.some(s=>s.chapters.some(c=>(c.notes&&c.notes.trim())||(c.links&&c.links.length)));
  const hasNotes=S.notes.length>0;
  if(!hasLib&&!hasNotes){showAppToast('No notes to export yet.');return;}
  let text='NEXUS — MASTER NOTES LEDGER\n'+'═'.repeat(40)+'\n\n';
  text+='LIBRARY NOTES\n'+'─'.repeat(30)+'\n\n';
  S.subjects.forEach(subj=>{
    const chWithNotes=subj.chapters.filter(c=>(c.notes&&c.notes.trim())||(c.links&&c.links.length));
    if(!chWithNotes.length) return;
    text+=`[${subj.name}]\n`;
    chWithNotes.forEach(ch=>{
      text+=`  • ${ch.name}:\n`;
      if(ch.notes&&ch.notes.trim()) text+=`    ${ch.notes.replace(/\n/g,'\n    ')}\n`;
      if(ch.links&&ch.links.length) text+=linksToText(ch.links,'    ');
      text+='\n';
    });
  });
  text+='\nNOTES TIMELINE\n'+'─'.repeat(30)+'\n\n';
  S.notes.forEach(n=>{
    text+=`[${n.date}] ${n.text}${(n.tags||[]).length?' | Tags: '+(n.tags||[]).join(', '):''}\n`;
    if(n.links&&n.links.length) text+=linksToText(n.links,'  ');
    text+='\n';
  });
  dlText(text,'nexus-master-ledger.txt');
}

// PROGRESS SCREEN
