function rProg(){
  const el=document.getElementById('pg-prog');
  const allCh=S.subjects.flatMap(s=>s.chapters.map(c=>({...c,sname:s.name,color:s.color})));
  const totalCh=allCh.length,doneCh=allCh.filter(c=>c.progress>=100).length;
  const overallPct=totalCh?Math.round(allCh.reduce((a,c)=>a+c.progress,0)/totalCh):0;
  // gather all priority tasks across all days (keep each task's own date so it can be marked done retroactively)
  const allPriWithDate=Object.entries(S.plannerData).flatMap(([ds,d])=>(d.priority||[]).map(t=>({...t,_ds:ds})));
  const allPri=allPriWithDate;
  const doneP=allPri.filter(t=>t.done).length;
  const priPct=allPri.length?Math.round(doneP/allPri.length*100):0;
  el.innerHTML=`
  <div style="font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px">Progress</div>
  <div class="card" style="display:flex;justify-content:space-around;align-items:center;padding:20px 16px;margin-bottom:14px">
    ${ringH(overallPct,90,9,'var(--sage)','Chapters Overall')}
    ${ringH(priPct,90,9,'var(--accent)','Priority Tasks')}
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="sec-title" style="margin-bottom:14px">Chapters by Subject</div>
    ${S.subjects.length===0?'<div class="empty">Add subjects in Library.</div>':
      S.subjects.map(s=>{
        const avg=s.chapters.length?Math.round(s.chapters.reduce((a,c)=>a+c.progress,0)/s.chapters.length):0;
        const done=s.chapters.filter(c=>c.progress>=100).length;
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <span style="font-weight:600;font-size:13px">${esc(s.name)}</span>
            <span style="font-size:11px;color:var(--muted)">${done}/${s.chapters.length} done · ${avg}% avg</span>
          </div>
          ${barH(avg,s.color,10)}
          ${s.chapters.map(ch=>`
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:10px">
            <div style="width:6px;height:6px;border-radius:50%;background:${s.color};flex-shrink:0"></div>
            <span style="font-size:11px;color:var(--muted);flex:1">${esc(ch.name)}</span>
            <span style="font-size:11px;font-weight:600;color:${s.color}">${ch.progress}%</span>
            <div style="width:60px;height:5px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden">
              <div style="height:100%;width:${ch.progress}%;background:${s.color}"></div>
            </div>
          </div>`).join('')}
        </div>`;}).join('')}
  </div>
  <div class="card">
    <div class="sec-title" style="margin-bottom:12px">Priority Tasks (All Time)</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="font-size:26px;font-weight:800;color:var(--accent)">${doneP}</div>
      <div style="font-size:13px;color:var(--muted)">completed of ${allPri.length} total</div>
    </div>
    ${barH(priPct,'var(--accent)',12)}
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:5px">
      ${allPri.slice(0,10).map(t=>`
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${t.done?'var(--sage)':'var(--accent)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.done?'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>':'<circle cx="12" cy="12" r="10"/>'}</svg>
        <span style="font-size:12px;flex:1;${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.text)}</span>
        ${!t.done?`<button class="att-btn" type="button" style="font-size:10px;padding:5px 9px;flex-shrink:0" onclick="progMarkTaskDone('${t.id}','${t._ds}')">✓ Mark as done</button>`:''}
      </div>`).join('')}
      ${allPri.length===0?'<div class="empty">No priority tasks yet.</div>':''}
      ${allPri.length>10?`<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">+${allPri.length-10} more</div>`:''}
    </div>
  </div>`;
}
// Marks a priority task as done straight from the Progress screen (used when a
// task from a past — or future — day was forgotten and only remembered later).
// It updates the task on the exact day it actually belongs to, so that day's
// own record shows it as completed too, not just this all-time summary.
function progMarkTaskDone(id,ds){
  const data=getDayData(ds);
  const idx=(data.priority||[]).findIndex(t=>t.id===id);
  if(idx>-1){ data.priority[idx].done=true; save(); }
  rProg();
}

  // Stats calculations

    if(ts.statsDates){
      const [s,e]=ts.statsDates;
      return logs.filter(l=>l.date>=s&&l.date<=e);

function setTimerMode(m){
  clearInterval(timerState.interval);timerState.interval=null;
  timerState.mode=m;timerState.running=false;timerState.elapsed=0;
  timerState.secsLeft=S.timerSettings.focusMins*60;timerState.phase='focus';
  rFocus();
}
function updateTimerSetting(k,v){
  if(!v||v<1)return;
  S.timerSettings[k]=v;save();
  if(!timerState.running){timerState.secsLeft=S.timerSettings.focusMins*60;}
  rFocus();
}
function timerToggle(){
  if(timerState.running){
    clearInterval(timerState.interval);timerState.interval=null;
    timerState.running=false;
    if(timerState.phase==='break'){
      // Break sessions: just reset silently, no prompt
      timerState.elapsed=0;timerState.overtime=false;timerState.pendingLog=null;
      rFocus();
    } else if(timerState.elapsed>=5){
      // Focus session: show keep/discard prompt
      timerState.pendingLog={
        id:uid(),
        subject:timerState.subj||'Unknown',
        duration:timerState.elapsed,
        type:'focus',
        overtime:timerState.overtime,
        overSecs:timerState.overtime?Math.max(0,timerState.elapsed-S.timerSettings.focusMins*60):0,
        date:todayStr(),startedAt:new Date().toISOString()
      };
      rFocus();
    } else {
      timerState.elapsed=0;timerState.overtime=false;
      rFocus();
    }
  } else {
    timerState.running=true;timerState.pendingLog=null;
    timerState.interval=setInterval(()=>{
      timerState.elapsed++;
      if(timerState.mode==='pomo'){
        timerState.secsLeft--;
        if(timerState.secsLeft<=0){
          if(!timerState.overtime){
            // Enter overtime — keep running, count extra time
            timerState.overtime=true;
            timerState.secsLeft=0;
          }
          // In overtime secsLeft stays 0, elapsed keeps growing
          if(curTab==='focus') updateTimerDisplay();
          return;
        }
      }
      // Update display every second without full re-render
      if(curTab==='focus') updateTimerDisplay();
    },1000);
    rFocus();
  }
}
function updateTimerDisplay(){
  const ts=timerState;
  if(ts.mode==='pomo'){
    const focusSecs=S.timerSettings.focusMins*60,breakSecs=S.timerSettings.breakMins*60;
    const phaseSecs=ts.phase==='focus'?focusSecs:breakSecs;
    const s=ts.overtime?0:ts.secsLeft;
    const mm=String(Math.floor(s/60)).padStart(2,'0');
    const ss=String(s%60).padStart(2,'0');
    const pct=ts.overtime?100:(1-(s/phaseSecs))*100;
    const r=96,circ=r*2*Math.PI,off=circ-(pct/100)*circ;
    // Update ring — use the timer's own id, not a generic "last circle on
    // the page" selector, since Home/Progress also render <circle> rings
    // that stay in the DOM after being visited and were shadowing this one.
    const progressRing=document.getElementById('pomo-progress-ring');
    if(progressRing){
      progressRing.setAttribute('stroke-dashoffset',off.toFixed(1));
      progressRing.setAttribute('stroke',ts.phase==='focus'?'var(--sage)':'var(--accent)');
    }
    // Update main time display
    const timerMain=document.getElementById('pomo-main-display');
    if(timerMain){
      if(ts.overtime){
        const em=Math.floor(ts.elapsed/60),es=ts.elapsed%60;
        timerMain.innerHTML='<span style="color:var(--accent)">'+String(em).padStart(2,'0')+':'+String(es).padStart(2,'0')+'</span>';
      } else {
        timerMain.textContent=mm+':'+ss;
      }
    }
    // Update phase label with live overtime counter
    const lbl=document.getElementById('timer-phase-lbl');
    if(lbl){
      if(ts.overtime){
        const overSecs=Math.max(0,ts.elapsed-phaseSecs);
        lbl.textContent='+ '+fmtSecsHMS(overSecs);
        lbl.style.color='var(--accent)';lbl.style.fontWeight='700';
      } else {
        lbl.textContent=ts.phase==='focus'?'Focus':'Break';
        lbl.style.color='var(--muted)';lbl.style.fontWeight='400';
      }
    }
  } else {
    const s=ts.elapsed;
    const digits=document.querySelectorAll('.flip-digit');
    if(digits[0]) digits[0].textContent=String(Math.floor(s/3600)).padStart(2,'0');
    if(digits[1]) digits[1].textContent=String(Math.floor((s%3600)/60)).padStart(2,'0');
    if(digits[2]) digits[2].textContent=String(s%60).padStart(2,'0');
  }
}
function timerReset(){
  clearInterval(timerState.interval);timerState.interval=null;
  timerState.running=false;timerState.elapsed=0;timerState.pendingLog=null;
  timerState.overtime=false;
  timerState.secsLeft=S.timerSettings.focusMins*60;timerState.phase='focus';
  rFocus();
}
function switchPhase(){
  clearInterval(timerState.interval);timerState.interval=null;
  timerState.running=false;timerState.elapsed=0;timerState.overtime=false;
  timerState.phase=timerState.phase==='focus'?'break':'focus';
  timerState.secsLeft=timerState.phase==='focus'?S.timerSettings.focusMins*60:S.timerSettings.breakMins*60;
  rFocus();
}
function savePendingLog(keep){
  if(keep&&timerState.pendingLog&&timerState.pendingLog.type!=='break'){
    S.studyLogs.unshift(timerState.pendingLog);save();
  }
  timerState.pendingLog=null;timerState.elapsed=0;timerState.overtime=false;
  rFocus();
}
function autoDiscardBreak(){
  // Called when break ends — no prompt shown, just silently discard
  timerState.pendingLog=null;timerState.elapsed=0;timerState.overtime=false;
}

function editStudyLog(id){
  const log=S.studyLogs.find(l=>l.id===id);

  _slEditDate=log.date;

  const h=Math.floor(log.duration/3600);
  const m=Math.floor((log.duration%3600)/60);
  const s=log.duration%60;
  log._eh=h;log._em=m;log._es2=s;
  _slShowForm(id);
}
function _slPickDate(id){
  // snapshot current inputs before opening calendar
  const log=S.studyLogs.find(l=>l.id===id);
  if(log){
    const subj=document.getElementById('sl-subj');
    const sh=document.getElementById('sl-h');
    const sm=document.getElementById('sl-m');
    const ss=document.getElementById('sl-s');
    if(subj)log._es=subj.value;
    if(sh)log._eh=parseInt(sh.value)||0;
    if(sm)log._em=parseInt(sm.value)||0;
    if(ss)log._es2=parseInt(ss.value)||0;
  }
  openCal('home',[...new Set(S.studyLogs.map(l=>l.date))],function(d){
    _slEditDate=d;
    _slShowForm(id);
  },true);
}
function saveStudyLog(id){
  const subj=document.getElementById('sl-subj').value.trim();
  const h=parseInt(document.getElementById('sl-h').value)||0;
  const m=parseInt(document.getElementById('sl-m').value)||0;
  const s=parseInt(document.getElementById('sl-s').value)||0;
  if(!subj||!_slEditDate)return;
  const duration=h*3600+m*60+s;
  if(duration<1)return;
  const log=S.studyLogs.find(l=>l.id===id);
  if(log){
    log.subject=subj;log.date=_slEditDate;log.duration=duration;
    delete log._es;delete log._eh;delete log._em;delete log._es2;
  }
  _slEditDate=null;
  save();closeM();rFocus();
}

our day. It reminds you that your present effort and your future success are not separate — they are directly connected. And you are the one building that connection, one day at a time.": "لا يكتفي Nexus بمساعدتك على تنظيم يومك، بل يذكِّرك بأنَّ جهدك الحاضر ونجاحك المستقبلي ليسا أمرين منفصلين، بل هما مرتبطان ارتباطًا مباشرًا. وأنت من يبني هذه الصِّلة، يومًا بعد يوم.", "Key Features": "أبرز المميزات", "Version 2.0.0": "الإصدار 2.0.0", "Jomana Hossen": "جُمانة حسين", "Ever since I started my journey in tech, I've had a single, constant dream: to build apps that truly help people and make their daily lives just a little bit easier.": "منذ بدأت رحلتي في عالم التقنية، كان لدي حلم واحد وثابت: أن أبتكر تطبيقات تساعد الناس بحق، وتجعل حياتهم اليومية أسهل ولو بقليل.", "As an engineering student, I know the struggle intimately. I know what it feels like to drown in endless tasks, to desperately try to organize scattered notes, and to constantly worry about forgetting something crucial. There were so many days where managing the stress of studying felt like a whole separate job.": "وكطالبة هندسة، أعرف هذه المعاناة جيدًا؛ أعرف تمامًا شعور الغرق في المهام التي لا تنتهي، والمحاولات المستميتة لتنظيم الملاحظات المشتتة، والقلق المستمر خوفًا من نسيان أمر هام. مرت عليّ أيام كثيرة كان فيها التعامل مع ضغوط الدراسة أشبه بوظيفة كاملة قائمة بذاتها.", "That's exactly why I poured my heart into building this app. I wanted to create a safe, organized space for students just like me — a tool to help you track your progress, clear the mental clutter, and stay on top of your goals. I truly hope it brings you the peace of mind and organization it brought me.": "لهذا السبب تحديدًا، وضعت كل شغفي في بناء هذا التطبيق. أردت إيجاد مساحة آمنة ومنظمة للطلاب الذين يمرون بنفس التجربة؛ أداة تساعدكم على متابعة إنجازاتكم، وتصفية الذهن من التشتت، والتركيز على أهدافكم. أتمنى من كل قلبي أن يمنحكم هذا التطبيق الهدوء والتنظيم اللذين أضافهما لحياتي.", "As I am still at the very beginning of my tech journey, I decided to build this application using AI to explore its potential as a development partner—and the results completely blew me away! 🚀": "وبما أنني لا أزال في بداية مشواري، قررت تطوير هذا التطبيق بمساعدة الذكاء الاصطناعي لاستكشاف إمكانياته كشريك في التطوير... والنتيجة أذهلتني تمامًا! 🚀", "While the final outcome exceeded my expectations, the real learning curve was in the communication. It took time, patience, and iterative prompting to align the AI perfectly with my vision and make it understand exactly what I wanted to build. It was an incredible lesson in human-AI collaboration.": "وعلى الرغم من أن النتيجة النهائية فاقت توقعاتي، إلا أن التجربة الحقيقية والدرس الأكبر كانا في كيفية التواصل والتوجيه. تطلب الأمر وقتًا، وصبرًا، ومحاولات متكررة في صياغة الأوامر (Prompts) لتوجيه الذكاء الاصطناعي بدقة نحو رؤيتي وضمان فهمه التام لما أطمح لبنائه. لقد كانت تجربة ملهمة ودرسًا رائعًا في التعاون بين الإنسان والذكاء الاصطناعي.", "Please let me know what you think, and if it helps you even a fraction as much as I hope it will, that would mean the world to me. Wish me luck! 🤍": "يسعدني جدًا أن أسمع آرائكم وانطباعاتكم، وإذا ساعدكم هذا التطبيق ولو بجزء بسيط مما أتمنى، فهذا سيعني لي الكثير. دعواتكم لي بالتوفيق! 🤍", "📁 Explore the Project Files & Full Guides:": "📁 لاستكشاف ملفات المشروع والأدلة الكاملة:", "🌍 English Version:": "🌍 النسخة الإنجليزية:", "🇪🇬 Arabic Version (النسخة العربية):": "🇪🇬 النسخة العربية:", "Copyright 2026 Jomana Hossen. All Intellectual Property Rights Reserved.": "حقوق النشر 2026 جُمانة حسين. جميع حقوق الملكية الفكرية محفوظة.", "Unauthorized use or duplication of this material without express permission is strictly prohibited. This app is protected by copyright law and international treaties. All source code, design, and intellectual property are the exclusive property of Jomana Hossen.": "يُمنع منعًا باتًا استخدام هذه المادة أو نسخها دون إذن صريح. هذا التطبيق محمي بقانون حقوق النشر والمعاهدات الدولية. جميع الأكواد البرمجية والتصميم والملكية الفكرية ملك حصري لجُمانة const MONTHS_LONG={January:"يناير",February:"فبراير",March:"مارس",April:"أبريل",May:"مايو",June:"يونيو",July:"يوليو",August:"أغسطس",September:"سبتمبر",October:"أكتوبر",November:"نوفمبر",December:"ديسمبر"};
const MONTHS_SHORT={Jan:"يناير",Feb:"فبراير",Mar:"مارس",Apr:"أبريل",May:"مايو",Jun:"يونيو",Jul:"يوليو",Aug:"أغسطس",Sep:"سبتمبر",Oct:"أكتوبر",Nov:"نوفمبر",Dec:"ديسمبر"};
const WEEKDAYS_LONG={Sunday:"الأحد",Monday:"الاثنين",Tuesday:"الثلاثاء",Wednesday:"الأربعاء",Thursday:"الخميس",Friday:"الجمعة",Saturday:"السبت"};

function arDateWords(str){
  let out=str;
  Object.keys(MONTHS_LONG).forEach(m=>{out=out.replace(new RegExp('\\b'+m+'\\b','g'),MONTHS_LONG[m]);});
  Object.keys(MONTHS_SHORT).forEach(m=>{out=out.replace(new RegExp('\\b'+m+'\\b','g'),MONTHS_SHORT[m]);});
  Object.keys(WEEKDAYS_LONG).forEach(d=>{out=out.replace(new RegExp('\\b'+d+'\\b','g'),WEEKDAYS_LONG[d]);});
  return out;
}

function trPhrase(raw){
  const trimmed=raw.trim();
  if(!trimmed) return raw;
  if(Object.prototype.hasOwnProperty.call(PHRASES,trimmed)){
    return raw.replace(trimmed,PHRASES[trimmed]);
  }
  for(const p of AR_PATTERNS){
    const m=trimmed.match(p.re);
    if(m) return raw.replace(trimmed,p.fn(m));
  }
  const dated=arDateWords(trimmed);
  if(dated!==trimmed) return raw.replace(trimmed,dated);
  return raw;
}
function tAlert(msg){
  alert(S.lang==='ar'?trPhrase(msg):msg);
}

function translateSubtree(root){
  if(S.lang!=='ar') return;
  if(!root||root.nodeType===8) return;
  if(root.nodeType===3){
    const p=root.parentElement;
    if(p && p.tagName!=='SCRIPT' && p.tagName!=='STYLE' && p.tagName!=='TEXTAREA'){
      const rv=root.nodeValue,rtv=trPhrase(rv);
      if(rtv!==rv) root.nodeValue=rtv;
    }
    return;
  }
  if(root.nodeType!==1) return;
  const tag=root.tagName;
  if(root.hasAttribute){
    ['placeholder','title','alt'].forEach(attr=>{
      if(root.hasAttribute(attr)){
        const v=root.getAttribute(attr);
        const tv=trPhrase(v);
        if(tv!==v) root.setAttribute(attr,tv);
      }
    });
  }
  if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA') return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement;
    if(!p) return NodeFilter.FILTER_REJECT;
    const t=p.tagName;
    if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA') return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];
  let n;
  while(n=walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{ const v=node.nodeValue,tv=trPhrase(v); if(tv!==v) node.nodeValue=tv; });
  root.querySelectorAll('[placeholder],[title],[alt]').forEach(el=>{
    ['placeholder','title','alt'].forEach(attr=>{
      if(el.hasAttribute(attr)){
        const v=el.getAttribute(attr);
        const tv=trPhrase(v);
        if(tv!==v) el.setAttribute(attr,tv);
      }
    });
  });
}

let __arObserverStarted=false;
let __arTranslating=false;
function ensureArObserver(){
  if(__arObserverStarted) return;
  __arObserverStarted=true;
  const observer=new MutationObserver(muts=>{
    if(S.lang!=='ar') return;
    if(__arTranslating) return;
    __arTranslating=true;
    muts.forEach(m=>{
      if(m.type==='characterData'){
        translateSubtree(m.target);
      } else if(m.type==='childList'){
        m.addedNodes.forEach(node=>translateSubtree(node));
      } else if(m.type==='attributes' && (m.attributeName==='placeholder'||m.attributeName==='title'||m.attributeName==='alt')){
        translateSubtree(m.target);
      }
    });
    __arTranslating=false;
  });
  observer.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','alt']});
}

async function collectAttachmentNodes(node,list){
  if(!node||typeof node!=='object') return;
  if(Array.isArray(node)){ for(const item of node) await collectAttachmentNodes(item,list); return; }
  if(node.id!=null && (node.storage==='idb'||node.storage==='inline') && ('blobKey' in node || 'dataUrl' in node)){
    list.push(node);
  }
  for(const k of Object.keys(node)) await collectAttachmentNodes(node[k],list);
}
async function inlineAttachmentBlobsForExport(root){
  const list=[];
  await collectAttachmentNodes(root,list);
  for(const att of list){
    try{
      if(att.storage==='idb' && att.blobKey){
        const blob=await getAttachmentBlob(att.blobKey);
        if(blob) att.exportDataUrl=await blobToDataURL(blob);
      }else if(att.dataUrl){
        att.exportDataUrl=att.dataUrl;
      }
    }catch(e){}
  }
}
async function exportScopedBackup(dataObj, filenameBase){
  try{
    const bundle={app:'nexus-planner-backup', version:1, exportedAt:new Date().toISOString(), data:dataObj};
    const clone=JSON.parse(JSON.stringify(bundle));
    await inlineAttachmentBlobsForExport(clone);
    const json=JSON.stringify(clone);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=mfSanitizeName(filenameBase)+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    showAppToast(t('backup_export_success'));
  }catch(e){
    showAppToast(t('backup_export_fail'));
  }
}
async function handleScopedImportFile(evt, applyFn){
  const input=evt&&evt.target;
  const file=input&&input.files&&input.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const bundle=JSON.parse(text);
    const data=(bundle&&bundle.data)?bundle.data:bundle;
    if(!data||typeof data!=='object') throw new Error('invalid');
    await rehydrateImportedAttachments(data);
    applyFn(data);
    save();
    showAppToast(t('backup_import_success'));
    setTimeout(()=>location.reload(),700);
  }catch(e){
    showAppToast(t('backup_import_fail'));
  }
  if(input) input.value='';
}

// A note created from a subject on the Home page also lives as a subjectNotes entry
// under S.plannerData[date] — that's what the Home page itself reads from. The scoped
// Notes Timeline backup only contains S.notes though, so importing it brings a
// subject-linked note back into the Timeline but leaves the Home page's copy (and its
// files/links) untouched unless we reconcile it here too — otherwise it looks restored
// in the Timeline while the Home page for that day stays blank.
function restoreSubjectNotesFromTimelineNotes(notes){
  if(!Array.isArray(notes)||!notes.length) return;
  const deletedMap=LS.g('deletedSubjNotes',{});
  let deletedMapChanged=false;
  notes.forEach(incoming=>{
    if(!incoming||!incoming._subjId||!incoming.date) return;
    const hasContent=(incoming.text&&incoming.text.trim())||(incoming.attachments&&incoming.attachments.length)||(incoming.links&&incoming.links.length);
    if(!hasContent) return;
    S.plannerData[incoming.date]=S.plannerData[incoming.date]||{};
    const dayData=S.plannerData[incoming.date];
    dayData.subjectNotes=dayData.subjectNotes||{};
    const localNote=subjectNoteObj(dayData.subjectNotes[incoming._subjId]);
    localNote.text=mergeNoteText(localNote.text,incoming.text);
    localNote.attachments=mergeArrayById(localNote.attachments,incoming.attachments);
    localNote.links=mergeArrayById(localNote.links,incoming.links);
    dayData.subjectNotes[incoming._subjId]=localNote;
    if(deletedMap[incoming._subjId]&&deletedMap[incoming._subjId].includes(incoming.date)){
      deletedMap[incoming._subjId]=deletedMap[incoming._subjId].filter(d=>d!==incoming.date);
      deletedMapChanged=true;
    }
  });
  if(deletedMapChanged) LS.s('deletedSubjNotes',deletedMap);
}

async function rehydrateImportedAttachments(node){
  if(!node||typeof node!=='object') return;
  if(Array.isArray(node)){ for(const item of node) await rehydrateImportedAttachments(item); return; }
  if(node.exportDataUrl){
    try{
      const blob=dataUrlToBlob(node.exportDataUrl);
      const newId=node.id||uid();
      await putAttachmentBlob(newId,blob);
      node.id=newId; node.blobKey=newId; node.storage='idb';
      delete node.exportDataUrl;
    }catch(e){
      node.id=node.id||uid();
      node.storage='inline'; node.dataUrl=node.exportDataUrl;
      delete node.exportDataUrl; delete node.blobKey;
    }
    return;
  }
  for(const k of Object.keys(node)) await rehydrateImportedAttachments(node[k]);
}

// Builds a merged value for a note-like text field during backup restore:
//  - if local is blank, the backup's text is used outright (nothing is lost either way)
//  - if local already matches the backup (ignoring incidental whitespace differences
//    like an extra space or blank line), nothing changes
//  - if the backup's text is already present somewhere in the local text (e.g. it was
//    already appended by a previous restore of this same backup), nothing changes —
//    restoring the same backup twice must not duplicate the same old text again
//  - otherwise, local has been edited (something deleted, added, or changed) and now
//    genuinely differs from the backup — BOTH are kept, the current text stays on top
//    exactly as it is now, and the backup's older version is appended below a labeled
//    divider.
// This applies to every "note" field across the app (Home subject notes, Notes
// Timeline, chapters, Vault, and My Files' photo notes) so a restore never silently
// overwrites or discards an edit made since the backup was taken, and never piles up
// duplicate copies of the same restored text either.
function _normTextForCompare(s){
  // Collapses runs of whitespace (spaces, tabs, blank lines) down to a single space,
  // so the *comparison* used to decide "same text or not" isn't tripped up by
  // formatting noise — the actual stored/displayed text is never touched by this,
  // only the values used for the equality/containment check below.
  return (s||'').replace(/\s+/g,' ').trim();
}
function mergeNoteText(localText,incomingText){
  const lt=(localText||'').trim();
  const it=(incomingText||'').trim();
  if(!it) return localText||'';
  if(!lt) return incomingText;
  const normLocal=_normTextForCompare(lt);
  const normIncoming=_normTextForCompare(it);
  if(!normIncoming) return localText||'';
  if(normLocal===normIncoming) return localText;
  if(normLocal.includes(normIncoming)) return localText;
  return `${localText}\n\n───\n\n📜 Text restored from the backup:\n${incomingText}`;
}
// Applies mergeNoteText to a specific text field across two arrays matched by id —
// used for fields like a note's/vault entry's own body text, which isn't a nested
// id-keyed collection so the generic tree-merge in mergeArrayById doesn't touch it.
function mergeTextFieldById(localArr,incomingArr,field){
  if(!Array.isArray(localArr)||!Array.isArray(incomingArr)) return;
  const byId={};
  localArr.forEach(item=>{ if(item&&item.id!=null) byId[item.id]=item; });
  incomingArr.forEach(item=>{
    if(!item||item.id==null) return;
    const existing=byId[item.id];
    if(existing) existing[field]=mergeNoteText(existing[field],item[field]);
  });
}
//
// For an item that already exists locally, only its recognized nested
// id-keyed arrays get merged (recursively) — every collection used anywhere
// in the data model needs to be listed here, or anything deleted from
// inside an already-existing container (a chapter inside a subject, a file
// inside a My Files folder, etc.) will never come back on restore, even
// though restoring the whole container from scratch works fine (that path
// just deep-clones the incoming object wholesale instead of merging it).
const NESTED_MERGE_ARRAY_KEYS=['children','attachments','links','chapters','items','folders'];
function mergeArrayById(local,incoming){
  local=Array.isArray(local)?local:[];
  incoming=Array.isArray(incoming)?incoming:[];
  const byId={};
  local.forEach(item=>{ if(item&&item.id!=null) byId[item.id]=item; });
  incoming.forEach(item=>{
    if(!item) return;
    const existing=item.id!=null?byId[item.id]:null;
    if(existing){
      NESTED_MERGE_ARRAY_KEYS.forEach(key=>{
        if(Array.isArray(existing[key])||Array.isArray(item[key])) existing[key]=mergeArrayById(existing[key],item[key]);
      });
      // Plain text fields (a chapter's notes, or a My Files image's caption) aren't
      // id-keyed arrays, so they're never touched by the merge above — reconcile them
      // here using the same "append the backup's version if edited since" strategy as
      // every other note field in the app.
      if(typeof item.notes==='string'||typeof existing.notes==='string') existing.notes=mergeNoteText(existing.notes,item.notes);
      if(typeof item.note==='string'||typeof existing.note==='string') existing.note=mergeNoteText(existing.note,item.note);
    }else{
      const copy=JSON.parse(JSON.stringify(item));
      local.push(copy);
      if(copy.id!=null) byId[copy.id]=copy;
    }
  });
  return local;
}
function mergePlannerData(localPD,incomingPD,restoredList){
  localPD=(localPD&&typeof localPD==='object')?localPD:{};
  incomingPD=(incomingPD&&typeof incomingPD==='object')?incomingPD:{};
  Object.keys(incomingPD).forEach(dateKey=>{
    const incomingDay=incomingPD[dateKey];
    if(!incomingDay) return;
    if(!localPD[dateKey]){
      localPD[dateKey]=JSON.parse(JSON.stringify(incomingDay));
      if(restoredList&&incomingDay.subjectNotes){
        Object.keys(incomingDay.subjectNotes).forEach(sid=>{
          const n=subjectNoteObj(incomingDay.subjectNotes[sid]);
          if((n.text&&n.text.trim())||(n.attachments&&n.attachments.length)||(n.links&&n.links.length)) restoredList.push({sid,date:dateKey});
        });
      }
      return;
    }
    const localDay=localPD[dateKey];
    ['goals','priority','dontForget','schedule'].forEach(key=>{
      localDay[key]=mergeArrayById(localDay[key],incomingDay[key]);
    });
    if(incomingDay.subjectNotes){
      localDay.subjectNotes=localDay.subjectNotes||{};
      Object.keys(incomingDay.subjectNotes).forEach(sid=>{
        const incomingNote=subjectNoteObj(incomingDay.subjectNotes[sid]);
        if(!localDay.subjectNotes[sid]){
          localDay.subjectNotes[sid]=JSON.parse(JSON.stringify(incomingNote));
          if(restoredList&&((incomingNote.text&&incomingNote.text.trim())||(incomingNote.attachments&&incomingNote.attachments.length)||(incomingNote.links&&incomingNote.links.length))) restoredList.push({sid,date:dateKey});
        }else{
          const localNote=subjectNoteObj(localDay.subjectNotes[sid]);
          const wasEmpty=!(localNote.text&&localNote.text.trim())&&!(localNote.attachments&&localNote.attachments.length)&&!(localNote.links&&localNote.links.length);
          localNote.text=mergeNoteText(localNote.text,incomingNote.text);
          localNote.attachments=mergeArrayById(localNote.attachments,incomingNote.attachments);
          localNote.links=mergeArrayById(localNote.links,incomingNote.links);
          localDay.subjectNotes[sid]=localNote;
          const nowHasContent=(localNote.text&&localNote.text.trim())||(localNote.attachments&&localNote.attachments.length)||(localNote.links&&localNote.links.length);
          if(restoredList&&wasEmpty&&nowHasContent) restoredList.push({sid,date:dateKey});
        }
      });
    }
  });
  return localPD;
}
async function handleImportBackupFile(evt){
  const input=evt&&evt.target?evt.target:document.getElementById('backupImportInput');
  const file=input&&input.files&&input.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const bundle=JSON.parse(text);
    const data=(bundle&&bundle.data)?bundle.data:bundle;
    if(!data||typeof data!=='object') throw new Error('invalid');
    await rehydrateImportedAttachments(data);

    S.subjects=mergeArrayById(S.subjects,data.subjects);
    mergeTextFieldById(S.notes,data.notes,'text');
    S.notes=mergeArrayById(S.notes,data.notes);
    S.studyLogs=mergeArrayById(S.studyLogs,data.studyLogs);
    S.weeklySchedule=mergeArrayById(S.weeklySchedule,data.weeklySchedule);
    S.myFiles=mergeArrayById(S.myFiles,data.myFiles);
    const __restored=[];
    S.plannerData=mergePlannerData(S.plannerData,data.plannerData,__restored);
    if(Array.isArray(data.vault)){
      const localVault=vaultGet();
      mergeTextFieldById(localVault,data.vault,'text');
      vaultSave(mergeArrayById(localVault,data.vault));
    }

    save(); // persist the merge first so refreshNotes() below reconciles against fresh data, not stale localStorage

    if(__restored.length){
      const deletedMap=LS.g('deletedSubjNotes',{});
      __restored.forEach(({sid,date})=>{
        if(deletedMap[sid]) deletedMap[sid]=deletedMap[sid].filter(d=>d!==date);
      });
      LS.s('deletedSubjNotes',deletedMap);
      refreshNotes();
      save();
    }
    showAppToast(t('backup_import_success'));
    setTimeout(()=>location.reload(),700);
  }catch(e){
    showAppToast(t('backup_import_fail'));
  }
  if(input) input.value='';
}

function copyNoteToVault(noteId){
  const n=S.notes.find(n=>n.id===noteId);
  if(!n){return;}
  const vault=vaultGet();
  const entry={id:uid(),text:n.text,tags:n.tags||[],sourceDate:n.date,addedAt:new Date().toISOString(),source:'Timeline',attachments:cloneAttachments(n.attachments||[]),links:cloneLinks(n.links||[])};
  vault.unshift(entry);
  vaultSave(vault);
  // Brief visual feedback — show a tiny toast
  showVaultToast('Saved to Vault ✓');
}
function copyChapNoteToVault(subjId,chapId){
  const subj=S.subjects.find(s=>s.id===subjId);
  const ch=subj&&subj.chapters.find(c=>c.id===chapId);
  if(!ch||((!ch.notes||!ch.notes.trim())&&!(ch.links&&ch.links.length))){showVaultToast('No notes to copy');return;}
  const vault=vaultGet();
  const entry={id:uid(),text:(ch.notes||'').trim(),tags:[subj.name,ch.name],sourceDate:todayStr(),addedAt:new Date().toISOString(),source:subj.name+' › '+ch.name,attachments:cloneAttachments(ch.attachments||[]),links:cloneLinks(ch.links||[])};
  vault.unshift(entry);
  vaultSave(vault);
  showVaultToast('Saved to Vault ✓');
}
function showVaultToast(msg){
  let t=document.getElementById('vault-toast');
  if(!t){t=document.createElement('div');t.id='vault-toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--sage);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';

}

    const db=b.sourceDate||(b.addedAt?b.addedAt.slice(0,10):'');
    if(da!==db) return da<db?1:-1;

           <button onclick="vaultSaveTag('${v.id}')" style="font-size:10px;padding:2px 8px;border-radius:20px;border:none;background:var(--sage);color:#fff;cursor:pointer;font-family:inherit">Add</button>
           <button onclick="vaultCancelTag()" style="font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--muted);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit">✕</button>`
        : `<button onclick="vaultStartAddTag('${v.id}')" style="font-size:10px;padding:2px 8px;border-radius:20px;border:1px dashed var(--sage);background:transparent;color:var(--sage);cursor:pointer;font-family:inherit">+ tag</button>`
      }
    </div>
  </div>`).join('')}
  `;

  // Re-focus search if it was active
  if(_vaultSearch){
    const inp=document.getElementById('vault-search-inp');
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
  }
}

let _vaultShowFilter=false;
function vaultFilterToggle(){
  // Use the existing openCal with range support — exactly like the notes filter
  openCal('notes-filter',[...new Set(vaultGet().map(v=>v.sourceDate||v.addedAt.slice(0,10)))],function(s,e){
    if(e){ _vaultFilterDate=s+'|'+e; }
    else { _vaultFilterDate=s; }
    rVault();
  });
}

function vaultExport(){
  const vault=vaultGet();
  if(!vault.length){showVaultToast('No notes to export');return;}

  // Apply same filters active in the UI
  let toExport=vault;
  if(_vaultSearch.trim()){
    const q=_vaultSearch.trim().toLowerCase();
    toExport=toExport.filter(v=>
      v.text.toLowerCase().includes(q)||
      (v.tags||[]).some(t=>t.toLowerCase().includes(q))||
      (v.source||'').toLowerCase().includes(q)
    );
  }
  if(_vaultFilterDate){
    if(_vaultFilterDate.includes('|')){
      const [s,e]=_vaultFilterDate.split('|');
      toExport=toExport.filter(v=>{const d=v.sourceDate||v.addedAt.slice(0,10);return d>=s&&d<=e;});
    } else {
      toExport=toExport.filter(v=>(v.sourceDate||v.addedAt.slice(0,10))===_vaultFilterDate);
    }
  }

  if(!toExport.length){showVaultToast('No notes found for selected filter');return;}

  let txt='NEXUS — NOTES EXPORT\n'+'─'.repeat(30)+'\n\n';
  toExport.forEach(v=>{
    const d=v.sourceDate||v.addedAt.slice(0,10);
    txt+='['+d+'] '+v.text;
    if((v.tags||[]).length) txt+=' | Tags: '+v.tags.join(', ');
    txt+='\n';
    if(v.links&&v.links.length) txt+=linksToText(v.links,'  ');
    txt+='\n';
  });
  txt=txt.trimEnd();
  dlText(txt,'Vault.txt');
  showVaultToast('Exported '+toExport.length+' note'+(toExport.length>1?'s':'')+' ✓');
}

function vaultClearAll(){
  openM(`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:32px;margin-bottom:10px">🗑️</div>
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">Clear All Vault Notes?</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">
        This will permanently delete all notes in your Vault. This cannot be undone.
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="vaultClearConfirmed()" class="btn btn-red" style="padding:10px 24px;font-size:14px">Yes, Delete All</button>
        <button onclick="closeM()" class="btn btn-n" style="padding:10px 24px;font-size:14px">Cancel</button>
      </div>
    </div>
  `);
}
function vaultClearConfirmed(){
  vaultSave([]);
  closeM();
  _vaultSearch='';
  _vaultFilterDate='';
  _vaultShowFilter=false;
  rVault();
  showVaultToast('Vault cleared');
}

function vaultInlineEdit(id){
  const vault=vaultGet();
  const v=vault.find(v=>v.id===id);
  if(!v)return;
  const textDiv=document.getElementById('vtext-'+id);
  if(!textDiv)return;
  // Only edit text — tags managed via + tag chips
  textDiv.outerHTML=`
    <textarea dir="auto" id="vinp-${id}" class="inp" rows="4" style="margin-bottom:8px;font-size:13px;line-height:1.65;resize:vertical">${esc(v.text)}</textarea>
    <div style="display:flex;gap:7px;margin-bottom:4px">
      <button onclick="vaultInlineSave('${id}')" class="btn btn-p" style="font-size:12px;padding:6px 14px">Save</button>
      <button onclick="rVault()" class="btn btn-n" style="font-size:12px;padding:6px 14px">Cancel</button>
    </div>`;
  const ta=document.getElementById('vinp-'+id);
  if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}

function vaultInlineSave(id){
  const ta=document.getElementById('vinp-'+id);
  if(!ta)return;
  const text=ta.value.trim();
  if(!text)return;
  const vault=vaultGet();
  const v=vault.find(v=>v.id===id);
  if(v){v.text=text;}
  vaultSave(vault);
  rVault();
  showVaultToast('Note updated ✓');
}
function openVaultAdd(){
  openM(`
    <h3 style="font-weight:700;margin-bottom:14px">📌 Add to Vault</h3>
    <textarea dir="auto" class="inp" id="vlt-text" rows="5" placeholder="Write your important note…" style="margin-bottom:9px"></textarea>
    <div id="vlt-tag-chips" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:22px"></div>
    <div style="display:flex;gap:6px;margin-bottom:13px">
      <input class="inp" id="vlt-tag-inp" placeholder="Add tag…" style="flex:1;font-size:12px;border-radius:20px;padding:5px 12px"
        onkeydown="if(event.key==='Enter'){event.preventDefault();_vltAddTag();}"/>
      <button onclick="_vltAddTag()" style="padding:5px 12px;border-radius:20px;border:none;background:var(--sage);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">+ Tag</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-p" onclick="vaultSaveNew()">Save to Vault</button>
      <button class="btn btn-n" onclick="closeM()">Cancel</button>
    </div>`);
}
let _vltTags=[];
function _vltAddTag(){
  const inp=document.getElementById('vlt-tag-inp');
  if(!inp||!inp.value.trim())return;
  const t=inp.value.trim();
  if(!_vltTags.includes(t))_vltTags.push(t);
  inp.value='';
  const chips=document.getElementById('vlt-tag-chips');
  if(chips) chips.innerHTML=_vltTags.map((t,i)=>`<span class="tag-chip" onclick="_vltRemoveTag(${i})">#${esc(t)} ×</span>`).join('');
  inp.focus();
}
function _vltRemoveTag(i){
  _vltTags.splice(i,1);
  const chips=document.getElementById('vlt-tag-chips');
  if(chips) chips.innerHTML=_vltTags.map((t,i)=>`<span class="tag-chip" onclick="_vltRemoveTag(${i})">#${esc(t)} ×</span>`).join('');
}
function vaultSaveNew(){
  const text=document.getElementById('vlt-text').value.trim();
  if(!text)return;
  // Also grab any unconfirmed tag in input
  const inp=document.getElementById('vlt-tag-inp');
  if(inp&&inp.value.trim()&&!_vltTags.includes(inp.value.trim()))_vltTags.push(inp.value.trim());
  const tags=[..._vltTags];
  _vltTags=[];
  const vault=vaultGet();
  vault.unshift({id:uid(),text,tags,sourceDate:todayStr(),addedAt:new Date().toISOString(),source:'Manual',attachments:[]});
  vaultSave(vault);
  closeM();rVault();
}
function vaultEdit(id){
  const vault=vaultGet();
  const v=vault.find(v=>v.id===id);
  if(!v)return;
  openM(`
    <h3 style="font-weight:700;margin-bottom:14px">✏️ Edit Vault Note</h3>
    <textarea dir="auto" class="inp" id="vlt-edit-text" rows="5" style="margin-bottom:9px">${esc(v.text)}</textarea>
    <input class="inp" id="vlt-edit-tags" value="${esc((v.tags||[]).join(', '))}" placeholder="Tags (comma-separated)" style="margin-bottom:13px"/>
    <div style="display:flex;gap:8px">
      <button class="btn btn-p" onclick="vaultSaveEdit('${id}')">Save</button>
      <button class="btn btn-n" onclick="closeM()">Cancel</button>
    </div>`);
}
function vaultSaveEdit(id){
  const text=document.getElementById('vlt-edit-text').value.trim();
  if(!text)return;
  const tags=document.getElementById('vlt-edit-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const vault=vaultGet();
  const v=vault.find(v=>v.id===id);
  if(v){v.text=text;v.tags=tags;}
  vaultSave(vault);closeM();rVault();
}
function vaultDel(id){
  const vault=vaultGet();
  const v=vault.find(v=>v.id===id);
  if(!v)return;
  const preview=(v.text||'').trim().slice(0,80);
  openM(`
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:40px;margin-bottom:12px">🗑</div>
      <div style="font-weight:700;font-size:16px;margin-bottom:8px">${t('Delete Note?')}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">
        ${preview?`"<strong>${esc(preview)}${v.text&&v.text.length>80?'…':''}</strong>" `:''}${t('will be permanently deleted.')}
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="confirmVaultDel('${id}')" class="btn btn-red" style="padding:10px 24px;font-size:14px">${t('Yes, Delete')}</button>
        <button onclick="closeM()" class="btn btn-n" style="padding:10px 24px;font-size:14px">${t('Cancel')}</button>
      </div>
    </div>
  `);
}
function confirmVaultDel(id){
  const vault=vaultGet().filter(v=>v.id!==id);
  vaultSave(vault);closeM();rVault();
}

window.addEventListener('DOMContentLoaded',()=>{
  const savedTheme=S.theme||'theme-sage';
  document.body.className=savedTheme;
  applyThemePalette(savedTheme);
  applyLangDom();

  rHome();
  migrateLegacyAttachmentsInBackground().catch(()=>{});

  // Keep the app on today's date across midnight without needing a manual refresh.
  let __lastKnownToday=todayStr();
  function checkDateRollover(){
    const nowToday=todayStr();
    if(nowToday!==__lastKnownToday){
      if(homeDate===__lastKnownToday) homeDate=nowToday;
      __lastKnownToday=nowToday;
      if(curTab==='home') rHome();
    }
  }
  setInterval(checkDateRollover,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDateRollover(); });
  window.addEventListener('focus',checkDateRollover);
});
